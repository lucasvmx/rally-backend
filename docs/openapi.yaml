openapi: 3.0.3
info:
  title: API Rally das Tribos
  version: 1.0.0
  description: >-
    API REST do Rally das Tribos. O backend usa JSON em snake_case. Rotas privadas
    aceitam a sessão Spring Security iniciada por login local ou OAuth2 Login do
    Google e também JWT no cabeçalho HTTP Authorization: Bearer. O JWT é emitido
    na resposta da sessão, expira em 15 minutos e contém role e, para
    coordenadores, tribe_id ou nation_id como
    escopo. O fluxo Google redireciona o navegador de volta à aplicação; depois
    o cliente consulta GET /api/v1/autenticacao/sessao para receber o JWT no
    corpo, sem token na URL. Login Google exige e-mail verificado e conta
    autorizada ou provisionada. A role e o escopo são obtidos da identidade
    autenticada, não de cabeçalhos definidos pelo cliente. As operações indicam
    os papéis e escopos exigidos quando aplicável.
servers:
  - url: http://localhost:8080
    description: Execução local padrão
tags:
  - name: Autenticação
  - name: Saúde
  - name: Dados do Rally
  - name: Relatórios
  - name: Regras
  - name: Formulários
    description: >-
      As respostas sob /api/v1/formularios recebem Cache-Control: no-store,
      X-Robots-Tag: noindex, nofollow, noarchive e
      Referrer-Policy: no-referrer.
  - name: Formulários públicos
    description: >-
      As respostas sob /api/v1/publico/formularios recebem Cache-Control:
      no-store, X-Robots-Tag: noindex, nofollow, noarchive e
      Referrer-Policy: no-referrer.
  - name: Usuários

security:
  - bearerJwt: []
  - sessaoAplicacao: []

paths:
  /api/v1/autenticacao/csrf:
    get:
      tags: [Autenticação]
      summary: Inicializa o token CSRF do navegador
      description: >-
        Retorna 204 sem corpo e materializa o token CSRF no cookie XSRF-TOKEN
        quando necessário. Para requisições de escrita protegidas por CSRF, o
        cliente deve enviar o valor do cookie no cabeçalho X-XSRF-TOKEN. O cookie
        é legível por JavaScript; SameSite é Lax e Secure acompanha a configuração
        do cookie de sessão.
      security: []
      responses:
        '204':
          description: Token CSRF inicializado; não há corpo de resposta
          headers:
            Set-Cookie:
              schema:
                type: string
              description: >-
                Pode definir o cookie XSRF-TOKEN, legível por JavaScript e com
                SameSite=Lax; Secure acompanha a configuração da sessão.

  /api/v1/autenticacao/sessao:
    get:
      tags: [Autenticação]
      summary: Consulta a sessão atual
      description: >-
        É público e retorna 200 tanto para uma sessão anônima quanto para uma
        sessão autenticada. A resposta identifica sessões locais como LOCAL e
        sessões Google como GOOGLE. Inicie OAuth2 Login do Google em GET
        /oauth2/authorization/google. Após o callback, o backend redireciona o
        navegador para / no fluxo de entrada normal; o cliente consulta esta
        rota com a sessão do navegador e recebe role, os IDs de escopo
        (tribe_id ou nation_id) e access_token no corpo JSON. O token não é
        enviado na URL.
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
        - {}
      responses:
        '200':
          description: Estado atual da sessão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaSessao'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/autenticacao/login:
    post:
      tags: [Autenticação]
      summary: Inicia uma sessão local com e-mail e senha
      description: >-
        Aceita contas locais existentes associadas a um usuário Rally com role
        atribuída. E-mails são aparados e normalizados para minúsculas para a
        consulta. A senha tem limite de 128
        caracteres e de 72 bytes em UTF-8. A primeira e a segunda falha retornam
        401 e informam que a conta será bloqueada após três tentativas. A terceira
        senha incorreta bloqueia a conta e já retorna 423; novas tentativas
        também retornam 423. Falhas para conta inexistente ou sem usuário Rally
        retornam 401, mas não incrementam o contador de bloqueio. Um login local
        correto zera o contador. Uma autenticação bem-sucedida também retorna no
        corpo role, os IDs de escopo aplicáveis e access_token. O JWT tem validade
        de 15 minutos e deve ser enviado em requisições privadas no cabeçalho HTTP
        Authorization com o esquema Bearer.
      security: []
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoLogin'
      responses:
        '200':
          description: Login local concluído; retorna a sessão e o JWT no corpo JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaSessao'
        '400':
          description: >-
            Corpo inválido ou senha com mais de 72 bytes em UTF-8. Erros de
            validação automática seguem o formato do Spring.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: E-mail ou senha incorretos; a resposta informa o bloqueio após três falhas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                mensagem: E-mail ou senha incorretos. Após três tentativas, a conta será bloqueada.
        '423':
          description: Conta bloqueada após três tentativas incorretas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                mensagem: Conta bloqueada após três tentativas incorretas. Entre com Google para redefinir a senha e recuperar o acesso.
        '403':
          description: Token CSRF ausente ou inválido; o filtro pode responder sem corpo

  /api/v1/autenticacao/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão atual
      description: >-
        Executa o logout do Spring Security e retorna sem corpo. Aceita a sessão
        do navegador ou o JWT no cabeçalho Authorization: Bearer. O endpoint
        encerra a sessão Spring Security, mas não revoga um JWT já emitido; esse
        token permanece válido até expirar
        (15 minutos após a emissão).
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      responses:
        '204':
          description: Logout concluído; não há corpo de resposta
        '401':
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                mensagem: Autenticação necessária.
        '403':
          description: Token CSRF ausente ou inválido; o filtro pode responder sem corpo

  /api/v1/autenticacao/senha/google:
    get:
      tags: [Autenticação]
      summary: Inicia o fluxo Google para criar ou recuperar senha local
      description: >-
        Marca a sessão para que, após a autenticação OAuth2 do
        Google, o navegador seja redirecionado a /definir-senha. A senha é então
        enviada a PUT /api/v1/autenticacao/senha. Esse fluxo cria ou substitui a
        senha local, zera as falhas e remove um bloqueio.
      security: []
      responses:
        '302':
          description: Redirecionamento para iniciar o fluxo Google
          headers:
            Location:
              schema:
                type: string
              description: >-
                /oauth2/authorization/google.

  /api/v1/autenticacao/senha:
    put:
      tags: [Autenticação]
      summary: Cria, redefine ou desbloqueia a senha local
      description: >-
        Requer uma identidade Google autenticada com e-mail verificado vinculada
        a uma conta Rally existente ou autorizada pelas configurações de acesso.
        A operação também aceita um JWT
        emitido pelo backend para essa identidade Google; sessão local sem
        provedor Google não é suficiente. A senha deve ter de 12 a 128 caracteres
        e no máximo 72 bytes em UTF-8. A operação cria ou atualiza a conta local,
        zera o contador de falhas e remove o bloqueio existente. Não há rota
        separada de recuperação: o fluxo GET /api/v1/autenticacao/senha/google
        conduz a esta operação. Cabeçalhos de autenticação de API usam
        o nome HTTP em inglês Authorization, com Bearer para JWT.
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoDefinirSenha'
      responses:
        '204':
          description: Senha definida; não há corpo de resposta
        '400':
          description: Corpo inválido ou senha com mais de 72 bytes em UTF-8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                mensagem: Autenticação necessária.
        '403':
          description: >-
            Identidade Google sem e-mail verificado ou não vinculada a uma conta
            autorizada do Rally; também pode indicar falha de CSRF, que pode
            ser respondida sem corpo pelo filtro Spring Security
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/saude:
    get:
      tags: [Saúde]
      summary: Verifica se o serviço está ativo
      security: []
      responses:
        '200':
          description: Serviço disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaSaude'

  /api/v1/nacoes:
    get:
      tags: [Dados do Rally]
      summary: Lista as nações
      responses:
        '200':
          description: Nações cadastradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaNacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/v1/tribos:
    get:
      tags: [Dados do Rally]
      summary: Lista as tribos
      responses:
        '200':
          description: Tribos cadastradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaTribo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/v1/missoes:
    get:
      tags: [Dados do Rally]
      summary: Lista as missões
      responses:
        '200':
          description: Missões cadastradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaMissao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      tags: [Dados do Rally]
      summary: Cria missões a partir de dados revisados
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA. Recebe de 1 a 100
        missões validadas pelo cliente e cria todas na mesma operação. A data
        de início não pode ser posterior à data de fim. link_google_forms é
        opcional; quando informado, deve ser um link HTTPS do Google Forms
        aceito pelo serviço (forms.gle/<caminho> ou
        docs.google.com/forms/<caminho>), sem porta explícita nem usuário na
        URL. O escopo da role vem da sessão autenticada
        ou do JWT em Authorization: Bearer, nunca de cabeçalhos definidos pelo
        cliente.
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoCriarMissoes'
      responses:
        '200':
          description: Missões criadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaMissao'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/missoes/interpretar:
    post:
      tags: [Dados do Rally]
      summary: Interpreta uma mensagem de missões com a IA
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA. Envia o texto para a
        IA configurada e retorna missões sugeridas para revisão; esta operação
        não as cria. Links Google Forms encontrados na mensagem podem ser
        associados às sugestões ou retornados para associação manual. A
        interpretação de missões exige OPENROUTER_API_KEY e
        OPENROUTER_MODELO_REGRAS configurados; se a configuração estiver
        ausente ou a IA não conseguir produzir uma interpretação, a resposta é
        503. A identidade e a role vêm da sessão autenticada ou do JWT em
        Authorization: Bearer.
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoInterpretacao'
      responses:
        '200':
          description: Sugestões de missões retornadas pela IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaInterpretacaoMissoes'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '503':
          description: Serviço de interpretação por IA indisponível ou não configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/relatorios:
    get:
      tags: [Relatórios]
      summary: Lista relatórios visíveis para a role do contexto de acesso
      description: >-
        A role e seu escopo são obtidos da identidade autenticada, incluindo do
        JWT apresentado em Authorization: Bearer. ASSISTENTE e
        ADMINISTRADOR_SISTEMA veem todos os relatórios;
        COORDENADOR_TRIBO vê relatórios da própria tribo e
        COORDENADOR_NACAO vê relatórios das tribos da própria nação.
      responses:
        '200':
          description: Relatórios visíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaRelatorio'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
    post:
      tags: [Relatórios]
      summary: Envia um relatório
      description: >-
        Exige role COORDENADOR_TRIBO ou COORDENADOR_NACAO no contexto autenticado
        e permite criar relatório somente para tribo dentro do escopo de
        tribe_id ou nation_id da identidade. O escopo é lido do JWT enviado em
        Authorization: Bearer ou da identidade Spring Security.
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoRelatorio'
      responses:
        '200':
          description: Relatório criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaRelatorio'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/relatorios/{id}/aprovar:
    post:
      tags: [Relatórios]
      summary: Aprova um relatório
      description: >-
        Exige role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto de acesso.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoRevisao'
      responses:
        '200':
          description: Relatório aprovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaRelatorio'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/relatorios/{id}/rejeitar:
    post:
      tags: [Relatórios]
      summary: Rejeita um relatório
      description: >-
        Exige role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto de acesso.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoRevisao'
      responses:
        '200':
          description: Relatório rejeitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaRelatorio'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/relatorios/{id}/arquivos:
    post:
      tags: [Relatórios]
      summary: Envia um arquivo para o Google Drive e o associa ao relatório
      description: >-
        O arquivo não pode estar vazio. A operação exige acesso de ASSISTENTE
        ou ADMINISTRADOR_SISTEMA, ou uma role de coordenador cujo escopo inclua
        a tribo ou nação do relatório, além de uma sessão Google com autorização
        para o Drive. Para autenticação por JWT, use Authorization: Bearer; o
        token de usuário Google contém a referência necessária para localizar a
        autorização OAuth do Drive. O limite configurado no Spring é 15 MB por
        arquivo e 80 MB para a requisição multipart. No perfil de produção, o
        cliente OAuth Google usa os escopos openid, profile, email e
        https://www.googleapis.com/auth/drive.file. Se
        GOOGLE_DRIVE_PASTA_CENTRAL estiver configurada, o upload usa essa pasta
        como raiz; se estiver vazia, localiza ou cria a pasta Rally. Também é
        necessária autorização Google para o Drive para concluir o envio.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
                  description: Arquivo não vazio a enviar ao Google Drive.
      responses:
        '200':
          description: Identificador do arquivo no Google Drive
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '502':
          description: O Google Drive não confirmou o envio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '503':
          description: A sessão ou a integração com o Google Drive não está disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/placar:
    get:
      tags: [Dados do Rally]
      summary: Gera o placar das tribos
      responses:
        '200':
          description: Tribos classificadas por pontuação
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaPlacar'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/v1/regras/interpretar:
    post:
      tags: [Regras]
      summary: Interpreta um texto de regras
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoInterpretacao'
      responses:
        '200':
          description: Interpretação produzida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaInterpretacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          description: Token CSRF ausente ou inválido; o filtro pode responder sem corpo

  /api/v1/usuarios/{email}/role:
    put:
      tags: [Usuários]
      summary: Define a role e o escopo de um usuário
      description: >-
        Requer a role ADMINISTRADOR_SISTEMA no contexto autenticado; aceita a
        sessão da aplicação ou JWT no cabeçalho HTTP Authorization com o esquema
        Bearer. Para COORDENADOR_TRIBO, tribe_id é obrigatório e nation_id deve
        ser omitido;
        para COORDENADOR_NACAO, nation_id é obrigatório e tribe_id deve ser
        omitido. ASSISTENTE e ADMINISTRADOR_SISTEMA não aceitam IDs de escopo.
        Os IDs de tribo ou nação precisam existir. O administrador inicial
        definido pela configuração não pode perder ADMINISTRADOR_SISTEMA. O
        e-mail do caminho é aparado e normalizado para minúsculas; a operação
        cria ou atualiza o perfil de acesso.
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/EmailUsuario'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoPapel'
            examples:
              coordenadorTribo:
                summary: Coordenador vinculado a uma tribo
                value:
                  role: COORDENADOR_TRIBO
                  tribe_id: 11111111-1111-1111-1111-111111111111
                  nation_id: null
              coordenadorNacao:
                summary: Coordenador vinculado a uma nação
                value:
                  role: COORDENADOR_NACAO
                  tribe_id: null
                  nation_id: 22222222-2222-2222-2222-222222222222
      responses:
        '200':
          description: Role e escopo atribuídos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaUsuario'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
          description: O administrador inicial configurado não pode perder sua role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/formularios:
    get:
      tags: [Formulários]
      summary: Lista formulários públicos cadastrados
      description: >-
        Exige role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto de acesso.
        Uma sessão Google precisa ter e-mail verificado e estar autorizada;
        também é aceito JWT em Authorization: Bearer.
      responses:
        '200':
          description: Formulários cadastrados, inclusive token de acesso público
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Formulario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
    post:
      tags: [Formulários]
      summary: Cria um formulário público para receber relatórios do período
      description: >-
        Um formulário é um link de coleta, normalmente mensal, e não fica
        associado a uma missão. ASSISTENTE ou ADMINISTRADOR_SISTEMA pode criar
        a definição com uma lista vazia de campos adicionais. Cada envio escolhe
        a própria missão. IDs de campo devem ser únicos e não podem ser
        nomes_integrantes, nomes_novos_afastados ou preenchido_por. Campo do tipo
        selecao precisa conter pelo menos uma opção.
        Novos requests omitem missao_id. Nas respostas de formulários novos,
        o record inclui missao_id nulo; definições antigas ainda podem trazer
        um UUID. O controller também tolera missao_id em um request de criação
        legado, mas descarta o valor ao persistir um formulário novo.
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinicaoFormulario'
            example:
              titulo: Relatório mensal
              descricao: Relatórios das missões realizadas neste mês.
              campos: []
      responses:
        '200':
          description: Formulário criado com token público gerado pelo servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Formulario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/formularios/{id}/desativar:
    post:
      tags: [Formulários]
      summary: Desativa um formulário público
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto de acesso.
      parameters:
        - $ref: '#/components/parameters/FormularioId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      responses:
        '200':
          description: >-
            Requisição concluída sem corpo. O controller não verifica se o UUID
            correspondeu a um formulário existente.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/publico/formularios/{token}:
    get:
      tags: [Formulários públicos]
      summary: Consulta a definição de um formulário público ativo
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenFormulario'
      responses:
        '200':
          description: >-
            Definição do formulário, nações, tribos e missões disponíveis. O
            requisito de foto é sempre exige_foto=true para este fluxo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormularioPublico'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/publico/formularios/{token}/respostas:
    post:
      tags: [Formulários públicos]
      summary: Envia respostas de formulário como coordenador autenticado
      description: >-
        Embora a definição do formulário possa ser consultada publicamente, o
        envio exige uma identidade autenticada com role COORDENADOR_TRIBO ou
        COORDENADOR_NACAO. O coordenador só pode enviar para uma tribo dentro
        do escopo de tribo ou nação associado à identidade. A role e o escopo
        são lidos da sessão Spring Security ou do JWT Authorization: Bearer;
        cabeçalhos definidos pelo cliente não controlam a autorização.
        A parte dados é JSON e deve incluir
        relatorio, nacao_id, nomes_integrantes, nomes_novos_afastados,
        preenchido_por e respostas adicionais. relatorio.missao_id é escolhido
        neste envio, sem vínculo com a definição do formulário. As quantidades
        em relatorio são contadas pelas linhas não vazias dos campos de nomes;
        uma linha contendo apenas "nenhum" (sem diferenciar maiúsculas) também
        não conta. As respostas adicionais devem usar IDs definidos no
        formulário, ter até 5.000 caracteres cada e respeitar os campos
        obrigatórios; valores do tipo numero devem ser decimais válidos e
        selecao deve corresponder a uma das opções definidas. Definições
        legadas que ainda tenham missao_id continuam
        restringindo os envios àquela missão.
        nomes_integrantes, nomes_novos_afastados e preenchido_por são
        obrigatórios. A parte arquivo é obrigatória e aceita uma única imagem
        JPEG, PNG ou WebP de até 5 MiB (5.242.880 bytes). Os valores fixos de
        nomes e responsável
        são gravados também em respostas sob as chaves
        nomes_integrantes, nomes_novos_afastados e preenchido_por.
        nacao_id deve corresponder à nação da tribo informada; missao_id deve
        identificar uma missão existente. O conteúdo da foto também precisa
        corresponder ao MIME type declarado. O arquivo deve ser JPEG, PNG ou
        WebP; o nome e a extensão do arquivo não determinam o formato aceito.
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/TokenFormulario'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [dados, arquivo]
              properties:
                dados:
                  $ref: '#/components/schemas/EnvioFormulario'
                arquivo:
                  type: string
                  format: binary
                  description: >-
                    Uma única imagem obrigatória JPEG, PNG ou WebP, com até
                    5 MiB (5.242.880 bytes). O conteúdo deve corresponder ao
                    tipo informado.
            encoding:
              arquivo:
                contentType: image/jpeg, image/png, image/webp
              dados:
                contentType: application/json
      responses:
        '200':
          description: Resposta registrada e identificador do relatório criado
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/formularios/respostas/{id}:
    get:
      tags: [Formulários]
      summary: Consulta respostas do formulário recebidas pela assistente
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto de acesso.
        O mapa respostas contém os valores fixos
        nomes_integrantes, nomes_novos_afastados e preenchido_por, além das
        respostas adicionais. Registros antigos podem continuar trazendo
        missao_id na definição. O acesso aos nomes,
        às respostas e à presença de foto fica restrito às roles ASSISTENTE e
        ADMINISTRADOR_SISTEMA.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
      responses:
        '200':
          description: >-
            Respostas associadas ao relatório. Se não houver resposta de
            formulário para o identificador, retorna uma lista vazia.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaFormulario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/formularios/respostas/{id}/foto:
    get:
      tags: [Formulários]
      summary: Obtém a foto enviada com as respostas
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto de acesso.
        Somente essas roles acessam a imagem pessoal.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
      responses:
        '200':
          description: Bytes da imagem armazenada
          headers:
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Envie o access_token no cabeçalho HTTP Authorization: Bearer. O servidor
        valida o JWT HS256, o emissor, a audiência e a validade temporal. Tokens
        emitidos pelo backend expiram 15 minutos após a emissão.
    sessaoAplicacao:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >-
        Cookie de sessão do Spring Security após login local ou OAuth2 Login do
        Google. O cookie é HttpOnly, SameSite=Lax e Secure conforme a
        configuração da sessão; as rotas privadas exigem sessão ou JWT.
  parameters:
    CabecalhoCsrf:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: >-
        Token obtido do cookie XSRF-TOKEN após consultar GET
        /api/v1/autenticacao/csrf. A proteção CSRF também se aplica ao envio de
        formulário sob /api/v1/publico/formularios; esse envio requer coordenador
        autenticado. Envie o
        cabeçalho e o cookie XSRF-TOKEN em métodos de escrita; o cookie de sessão
        também acompanha as requisições quando houver sessão autenticada.
      schema:
        type: string
    EmailUsuario:
      name: email
      in: path
      required: true
      description: E-mail do usuário cuja role e escopo serão definidos.
      schema:
        type: string
    RelatorioId:
      name: id
      in: path
      required: true
      description: Identificador UUID do relatório.
      schema:
        type: string
        format: uuid
    FormularioId:
      name: id
      in: path
      required: true
      description: Identificador UUID do formulário.
      schema:
        type: string
        format: uuid
    TokenFormulario:
      name: token
      in: path
      required: true
      description: Token hexadecimal de 64 caracteres do formulário público.
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
  responses:
    NaoAutenticado:
      description: >-
        Autenticação necessária. A API retorna application/json com a propriedade
        mensagem.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            mensagem: Autenticação necessária.
    ErroRequisicao:
      description: >-
        Requisição inválida. Erros de negócio tratados pela API incluem a
        propriedade mensagem; erros automáticos de validação seguem o formato
        do Spring e podem incluir outras propriedades.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    AcessoNegado:
      description: >-
        Acesso negado para o papel ou escopo atual. Erros de autorização tratados
        pelos serviços retornam JSON com mensagem. Falhas CSRF ou rejeições pelo
        filtro Spring Security podem ser respondidas sem corpo JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Recurso inexistente ou formulário público inválido ou desativado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    RequisicaoLogin:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
          description: E-mail aparado e convertido para minúsculas antes da consulta.
        senha:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Senha da conta local. Além do limite de 128 caracteres, o endpoint
            rejeita valores com mais de 72 bytes em UTF-8.
    RequisicaoDefinirSenha:
      type: object
      required: [senha]
      properties:
        senha:
          type: string
          minLength: 12
          maxLength: 128
          description: >-
            Nova senha local. Além do intervalo de 12 a 128 caracteres, o
            endpoint rejeita valores com mais de 72 bytes em UTF-8.
    PapelUsuario:
      type: string
      enum: [ASSISTENTE, COORDENADOR_TRIBO, COORDENADOR_NACAO, ADMINISTRADOR_SISTEMA]
    RespostaSessao:
      type: object
      description: >-
        Role é o papel do usuário. Para COORDENADOR_TRIBO, tribe_id informa o
        escopo; para COORDENADOR_NACAO, nation_id informa o escopo. Os dois IDs
        são null para ASSISTENTE e ADMINISTRADOR_SISTEMA. Não há uma propriedade
        JSON separada chamada scope.
      required: [autenticado, email, nome, provedor, email_verificado, role, tribe_id, nation_id, access_token]
      properties:
        autenticado:
          type: boolean
        email:
          type: string
          nullable: true
          description: Nulo para sessão anônima.
        nome:
          type: string
          nullable: true
        provedor:
          type: string
          enum: [GOOGLE, LOCAL]
          nullable: true
        email_verificado:
          type: boolean
        role:
          type: string
          enum: [ASSISTENTE, COORDENADOR_TRIBO, COORDENADOR_NACAO, ADMINISTRADOR_SISTEMA]
          nullable: true
          description: Nulo para uma sessão anônima.
        tribe_id:
          type: string
          format: uuid
          nullable: true
          description: Escopo da role COORDENADOR_TRIBO; nulo para as demais roles.
        nation_id:
          type: string
          format: uuid
          nullable: true
          description: Escopo da role COORDENADOR_NACAO; nulo para as demais roles.
        access_token:
          type: string
          nullable: true
          description: JWT de acesso, válido por 15 minutos; nulo para sessão anônima.
    RequisicaoPapel:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/PapelUsuario'
        tribe_id:
          type: string
          format: uuid
          nullable: true
          description: Obrigatório para COORDENADOR_TRIBO; deve ser omitido ou nulo para outras roles.
        nation_id:
          type: string
          format: uuid
          nullable: true
          description: Obrigatório para COORDENADOR_NACAO; deve ser omitido ou nulo para outras roles.
    RespostaUsuario:
      type: object
      required: [id, email, role, tribe_id, nation_id]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/PapelUsuario'
        tribe_id:
          type: string
          format: uuid
          nullable: true
        nation_id:
          type: string
          format: uuid
          nullable: true
    Erro:
      type: object
      description: >-
        Erros tratados explicitamente pela API usam a propriedade mensagem.
        Respostas de validação automática do Spring podem incluir outras
        propriedades, pois seguem o formato padrão do framework.
      additionalProperties: true
      properties:
        mensagem:
          type: string
          description: Mensagem da falha retornada pelo handler de exceções da API.
    RespostaSaude:
      type: object
      required: [status, servico, idioma]
      properties:
        status:
          type: string
          example: ok
        servico:
          type: string
          example: servico-rally
        idioma:
          type: string
          example: pt-BR
    RespostaNacao:
      type: object
      required: [id, nome]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
    RespostaTribo:
      type: object
      required: [id, nome, ativa, nacao_id, nacao_nome]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        ativa:
          type: boolean
        nacao_id:
          type: string
          format: uuid
        nacao_nome:
          type: string
    RespostaMissao:
      type: object
      required:
        - id
        - nome
        - descricao
        - data_inicio
        - data_fim
        - prazo_envio
        - pontos_por_pessoa
        - pontos_por_novo_afastado
        - bonificacao_a_cada_cinco_novos
        - meta_nacional
        - bonificacao_meta_nacional
        - exige_foto
        - tipo_pessoa
        - link_google_forms
        - status
        - versao
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        descricao:
          type: string
          nullable: true
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date
        prazo_envio:
          type: string
          description: Data e hora local de São Paulo, sem offset de fuso horário; pode ser nulo.
          nullable: true
        pontos_por_pessoa:
          type: integer
        pontos_por_novo_afastado:
          type: integer
        bonificacao_a_cada_cinco_novos:
          type: integer
        meta_nacional:
          type: integer
        bonificacao_meta_nacional:
          type: integer
        exige_foto:
          type: boolean
        tipo_pessoa:
          type: string
        link_google_forms:
          type: string
          maxLength: 2048
          nullable: true
          description: Link HTTPS opcional associado à missão.
        status:
          type: string
        versao:
          type: integer
    RequisicaoRelatorio:
      type: object
      required: [missao_id, tribo_id]
      properties:
        missao_id:
          type: string
          format: uuid
        tribo_id:
          type: string
          format: uuid
        quantidade_pessoas:
          type: integer
          minimum: 0
          default: 0
        quantidade_novos_afastados:
          type: integer
          minimum: 0
          default: 0
        observacoes:
          type: string
          nullable: true
    RespostaRelatorio:
      type: object
      required:
        - id
        - missao_id
        - missao_nome
        - tribo_id
        - tribo_nome
        - nacao_nome
        - quantidade_pessoas
        - quantidade_novos_afastados
        - observacoes
        - enviado_em
        - atrasado
        - status
        - pontos_aprovados
        - justificativa_revisao
      properties:
        id:
          type: string
          format: uuid
        missao_id:
          type: string
          format: uuid
        missao_nome:
          type: string
        tribo_id:
          type: string
          format: uuid
        tribo_nome:
          type: string
        nacao_nome:
          type: string
        quantidade_pessoas:
          type: integer
        quantidade_novos_afastados:
          type: integer
        observacoes:
          type: string
          nullable: true
        enviado_em:
          type: string
          description: Data e hora local de São Paulo, sem offset de fuso horário.
        atrasado:
          type: boolean
        status:
          type: string
        pontos_aprovados:
          type: integer
        justificativa_revisao:
          type: string
          nullable: true
    RequisicaoRevisao:
      type: object
      properties:
        justificativa:
          type: string
          nullable: true
    RespostaPlacar:
      type: object
      required: [posicao, tribo_id, tribo_nome, nacao_nome, pontos, pessoas_aprovadas, relatorios_aprovados, bonus_nacional]
      properties:
        posicao:
          type: integer
        tribo_id:
          type: string
          format: uuid
        tribo_nome:
          type: string
        nacao_nome:
          type: string
        pontos:
          type: integer
          format: int64
        pessoas_aprovadas:
          type: integer
          format: int64
        relatorios_aprovados:
          type: integer
          format: int64
        bonus_nacional:
          type: integer
          format: int64
    RequisicaoInterpretacao:
      type: object
      required: [texto]
      properties:
        texto:
          type: string
          minLength: 1
          maxLength: 40000
          description: Texto não vazio nem composto apenas por espaços.
    DadosMissao:
      type: object
      required:
        - nome
        - data_inicio
        - data_fim
        - pontos_por_pessoa
        - pontos_por_novo_afastado
        - bonificacao_a_cada_cinco_novos
        - meta_nacional
        - bonificacao_meta_nacional
        - tipo_pessoa
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 180
          description: Não pode ser vazio ou composto apenas por espaços.
        descricao:
          type: string
          maxLength: 10000
          nullable: true
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date
        prazo_envio:
          type: string
          description: Data e hora local de São Paulo, sem offset de fuso horário.
          nullable: true
        pontos_por_pessoa:
          type: integer
          minimum: 0
          maximum: 1000000
        pontos_por_novo_afastado:
          type: integer
          minimum: 0
          maximum: 1000000
        bonificacao_a_cada_cinco_novos:
          type: integer
          minimum: 0
          maximum: 1000000
        meta_nacional:
          type: integer
          minimum: 0
          maximum: 1000000
        bonificacao_meta_nacional:
          type: integer
          minimum: 0
          maximum: 1000000
        exige_foto:
          type: boolean
        tipo_pessoa:
          type: string
          enum: [integrante, novo_ou_afastado]
        link_google_forms:
          type: string
          maxLength: 2048
          nullable: true
          description: >-
            Opcional. Se não for nulo nem vazio, deve ser um link HTTPS de
            forms.gle/<caminho> ou docs.google.com/forms/<caminho>; espaços
            nas extremidades são removidos antes de salvar.
    RequisicaoCriarMissoes:
      type: object
      required: [missoes]
      properties:
        missoes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DadosMissao'
    RespostaInterpretacaoMissoes:
      type: object
      required: [origem, mensagem, texto_original, missoes, links_google_forms, ambiguidades]
      description: >-
        Retornada apenas quando a IA consegue interpretar a mensagem. Cada
        sugestão é um objeto de dados de missão; revise as sugestões e
        ambiguidades antes de enviá-las para criação.
      properties:
        origem:
          type: string
          enum: [OPENROUTER]
        mensagem:
          type: string
        texto_original:
          type: string
        missoes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/MissaoSugerida'
        links_google_forms:
          type: array
          description: Links Google Forms HTTPS reconhecidos na mensagem original.
          items:
            type: string
            maxLength: 2048
        ambiguidades:
          type: array
          items:
            type: string
    MissaoSugerida:
      type: object
      description: >-
        Objeto estruturado retornado pela IA. Limites de tamanho e validações
        de entrada são aplicados quando a sugestão é enviada para criação.
      required:
        - nome
        - descricao
        - data_inicio
        - data_fim
        - prazo_envio
        - pontos_por_pessoa
        - pontos_por_novo_afastado
        - bonificacao_a_cada_cinco_novos
        - meta_nacional
        - bonificacao_meta_nacional
        - exige_foto
        - tipo_pessoa
        - link_google_forms
      properties:
        nome:
          type: string
          minLength: 1
          nullable: true
        descricao:
          type: string
          nullable: true
        data_inicio:
          type: string
          format: date
          nullable: true
        data_fim:
          type: string
          format: date
          nullable: true
        prazo_envio:
          type: string
          description: Data e hora local de São Paulo, sem offset de fuso horário.
          nullable: true
        pontos_por_pessoa:
          type: integer
          minimum: 0
          maximum: 1000000
        pontos_por_novo_afastado:
          type: integer
          minimum: 0
          maximum: 1000000
        bonificacao_a_cada_cinco_novos:
          type: integer
          minimum: 0
          maximum: 1000000
        meta_nacional:
          type: integer
          minimum: 0
          maximum: 1000000
        bonificacao_meta_nacional:
          type: integer
          minimum: 0
          maximum: 1000000
        exige_foto:
          type: boolean
        tipo_pessoa:
          type: string
          enum: [integrante, novo_ou_afastado]
        link_google_forms:
          type: string
          maxLength: 2048
          nullable: true
          description: Link HTTPS extraído da mensagem; nulo quando não associado.
    RespostaInterpretacao:
      type: object
      required: [origem, mensagem, texto_original, regras, ambiguidades]
      description: >-
        A origem é OPENROUTER quando a consulta configurada funciona e
        FALLBACK_LOCAL quando OpenRouter não está configurado ou falha. O
        conteúdo de cada item de regras é definido pelo interpretador; somente
        as chaves nome_missao e exige_foto são exigidas na resposta da IA.
      properties:
        origem:
          type: string
          enum: [OPENROUTER, FALLBACK_LOCAL]
        mensagem:
          type: string
        texto_original:
          type: string
        regras:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        ambiguidades:
          type: array
          items:
            type: string
    CampoFormulario:
      type: object
      required: [id, titulo, tipo]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
          description: Valor não pode ser vazio nem composto somente por espaços.
        titulo:
          type: string
          minLength: 1
          maxLength: 200
          description: Valor não pode ser vazio nem composto somente por espaços.
        tipo:
          type: string
          enum: [texto, paragrafo, numero, selecao]
        obrigatorio:
          type: boolean
          default: false
        opcoes:
          type: array
          nullable: true
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 200
            description: Valor não pode ser vazio nem composto somente por espaços.
    DefinicaoFormulario:
      type: object
      required: [titulo, campos]
      properties:
        missao_id:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: >-
            Campo legado aceito na criação, mas ignorado; formulários novos
            são salvos sem missão associada.
        titulo:
          type: string
          minLength: 1
          maxLength: 200
          description: Valor não pode ser vazio nem composto somente por espaços.
        descricao:
          type: string
          maxLength: 3000
          nullable: true
        campos:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/CampoFormulario'
    DefinicaoFormularioPersistida:
      allOf:
        - $ref: '#/components/schemas/DefinicaoFormulario'
        - type: object
          required: [missao_id]
          properties:
            missao_id:
              type: string
              format: uuid
              nullable: true
              deprecated: true
              readOnly: true
              description: >-
                Campo somente de leitura. Pode conter a missão antiga ou ser
                nulo em formulários criados sem associação a missão.
    Formulario:
      type: object
      required: [id, token, ativo, definicao]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          pattern: '^[a-f0-9]{64}$'
        ativo:
          type: boolean
        definicao:
          $ref: '#/components/schemas/DefinicaoFormularioPersistida'
    RelatorioFormulario:
      type: object
      description: >-
        Dados do relatório para esta resposta. As quantidades são derivadas
        da quantidade de linhas não vazias em nomes_integrantes e
        nomes_novos_afastados, respectivamente. Cada lista aceita no máximo
        200 nomes.
      required: [missao_id, tribo_id]
      properties:
        missao_id:
          type: string
          format: uuid
        tribo_id:
          type: string
          format: uuid
        quantidade_pessoas:
          type: integer
          minimum: 0
          default: 0
        quantidade_novos_afastados:
          type: integer
          minimum: 0
          default: 0
        observacoes:
          type: string
          nullable: true
    EnvioFormulario:
      type: object
      required:
        - relatorio
        - nacao_id
        - nomes_integrantes
        - nomes_novos_afastados
        - preenchido_por
        - respostas
      properties:
        relatorio:
          $ref: '#/components/schemas/RelatorioFormulario'
        nacao_id:
          type: string
          format: uuid
          description: Deve corresponder à nação da tribo informada no relatório.
        nomes_integrantes:
          type: string
          minLength: 1
          maxLength: 5000
          description: Lista de integrantes, com um nome por linha.
        nomes_novos_afastados:
          type: string
          minLength: 1
          maxLength: 5000
          description: Lista de pessoas novas ou afastadas, com um nome por linha.
        preenchido_por:
          type: string
          minLength: 1
          maxLength: 200
          description: Nome da pessoa que preencheu o formulário.
        respostas:
          type: object
          maxProperties: 30
          additionalProperties:
            type: string
            maxLength: 5000
    FormularioPublico:
      type: object
      required: [definicao, nacoes, tribos, missoes, exige_foto]
      properties:
        definicao:
          $ref: '#/components/schemas/DefinicaoFormularioPersistida'
        nacoes:
          type: array
          items:
            $ref: '#/components/schemas/RespostaNacao'
        tribos:
          type: array
          items:
            $ref: '#/components/schemas/RespostaTribo'
        missoes:
          type: array
          items:
            $ref: '#/components/schemas/RespostaMissao'
        exige_foto:
          type: boolean
          enum: [true]
    RespostaFormulario:
      type: object
      required: [respostas, definicao, tem_foto]
      properties:
        respostas:
          type: object
          description: >-
            Respostas adicionais e valores fixos do envio. O backend
            armazena nomes_integrantes, nomes_novos_afastados e preenchido_por
            também neste mapa; esses campos podem não existir em registros
            legados.
          properties:
            nomes_integrantes:
              type: string
            nomes_novos_afastados:
              type: string
            preenchido_por:
              type: string
          additionalProperties:
            type: string
        definicao:
          $ref: '#/components/schemas/DefinicaoFormularioPersistida'
        tem_foto:
          type: boolean
