openapi: 3.0.3
info:
  title: API Rally das Tribos
  version: 1.0.0
  description: >-
    API REST do Rally das Tribos. O backend usa JSON em snake_case. Rotas privadas
    aceitam a sessão Spring Security iniciada por login local ou OAuth2 Login do
    Google e também JWT no cabeçalho HTTP Authorization: Bearer. O JWT é emitido
    na resposta da sessão, expira em 48 horas e contém role e, para
    coordenadores, tribe_id ou nation_id como
    escopo. O fluxo Google redireciona o navegador de volta à aplicação; depois
    o cliente consulta GET /api/v1/autenticacao/sessao para receber o JWT no
    corpo, sem token na URL. Login Google exige e-mail verificado e conta
    autorizada ou provisionada. A role e o escopo são obtidos da identidade
    autenticada, não de cabeçalhos definidos pelo cliente. As operações indicam
    os papéis e escopos exigidos quando aplicável. Logins locais com senha
    provisória criam uma sessão sem access_token e exigem a troca da senha antes
    de acessar outras rotas privadas.
servers:
  - url: http://localhost:8080
    description: Execução local padrão
tags:
  - name: Autenticação
  - name: Saúde
  - name: Dados do Rally
    description: >-
      Missões e pontuações manuais pertencem a um rally com período próprio. O
      placar combina relatórios aprovados e pontuações manuais do rally
      consultado. Sem seleção explícita, considera o rally que contém a data
      atual em America/Sao_Paulo; quando não há rally ativo, retorna as tribos
      sem pontos.
  - name: Relatórios
  - name: Regras
  - name: Formulários
    description: >-
      As respostas sob /api/v1/formularios recebem Cache-Control: no-store,
      X-Robots-Tag: noindex, nofollow, noarchive e
      Referrer-Policy: no-referrer.
  - name: Formulários públicos
    description: >-
      As respostas sob /api/v1/publico/formularios recebem Cache-Control:
      no-store, X-Robots-Tag: noindex, nofollow, noarchive e
      Referrer-Policy: no-referrer.
  - name: Usuários

security:
  - bearerJwt: []
  - sessaoAplicacao: []

paths:
  /api/v1/autenticacao/csrf:
    get:
      tags: [Autenticação]
      summary: Inicializa o token CSRF do navegador
      description: >-
        Retorna 204 sem corpo e materializa o token CSRF no cookie XSRF-TOKEN
        quando necessário. Para requisições de escrita protegidas por CSRF, o
        cliente deve enviar o valor do cookie no cabeçalho X-XSRF-TOKEN. O cookie
        é legível por JavaScript; SameSite é Lax e Secure acompanha a configuração
        do cookie de sessão.
      security: []
      responses:
        '204':
          description: Token CSRF inicializado; não há corpo de resposta
          headers:
            Set-Cookie:
              schema:
                type: string
              description: >-
                Pode definir o cookie XSRF-TOKEN, legível por JavaScript e com
                SameSite=Lax; Secure acompanha a configuração da sessão.

  /api/v1/autenticacao/sessao:
    get:
      tags: [Autenticação]
      summary: Consulta a sessão atual
      description: >-
        É público e retorna 200 tanto para uma sessão anônima quanto para uma
        sessão autenticada. A resposta identifica sessões locais como LOCAL e
        sessões Google como GOOGLE. Inicie OAuth2 Login do Google em GET
        /oauth2/authorization/google. Após o callback, o backend redireciona o
        navegador para / no fluxo de entrada normal; o cliente consulta esta
        rota com a sessão do navegador e recebe role, os IDs de escopo
        (tribe_id ou nation_id) e access_token no corpo JSON. O token não é
        enviado na URL. Em uma sessão local autenticada por senha provisória,
        troca_senha_obrigatoria é true e access_token é null; essa sessão só
        autoriza, entre as rotas privadas, a troca da senha provisória e o
        logout. access_token também é null para uma sessão anônima.
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
        - {}
      responses:
        '200':
          description: Estado atual da sessão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaSessao'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/autenticacao/login:
    post:
      tags: [Autenticação]
      summary: Inicia uma sessão local com e-mail e senha
      description: >-
        Aceita contas locais existentes associadas a um usuário Rally com role
        atribuída. E-mails são aparados e normalizados para minúsculas para a
        consulta. A senha tem limite de 128
        caracteres e de 72 bytes em UTF-8. A primeira e a segunda falha retornam
        401 e informam que a conta será bloqueada após três tentativas. A terceira
        senha incorreta bloqueia a conta e já retorna 423; novas tentativas
        também retornam 423. Falhas para conta inexistente ou sem usuário Rally
        retornam 401, mas não incrementam o contador de bloqueio. Um login local
        correto zera o contador e atualiza ultimo_login_em. Um login com senha
        provisória retorna 200 com uma sessão autenticada,
        troca_senha_obrigatoria true e access_token null; essa sessão não
        autoriza outras operações privadas além da troca de senha e logout.
        Depois da troca, o servidor encerra a sessão e é necessário fazer login
        novamente. Login com senha não provisória retorna role, os IDs de escopo
        aplicáveis e access_token.
        O JWT tem validade de 48 horas e deve ser enviado em requisições privadas
        no cabeçalho HTTP Authorization com o esquema Bearer.
      security: []
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoLogin'
      responses:
        '200':
          description: >-
            Login local concluído. access_token é null quando troca_senha_obrigatoria
            é true; o login normal retorna o JWT no corpo JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaSessao'
        '400':
          description: >-
            Corpo inválido ou senha com mais de 72 bytes em UTF-8. Erros de
            validação automática seguem o formato do Spring.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: E-mail ou senha incorretos; a resposta informa o bloqueio após três falhas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                mensagem: E-mail ou senha incorretos. Após três tentativas, a conta será bloqueada.
        '423':
          description: Conta bloqueada após três tentativas incorretas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                mensagem: Conta bloqueada após três tentativas incorretas. Entre com Google para redefinir a senha e recuperar o acesso.
        '403':
          description: Token CSRF ausente ou inválido; o filtro pode responder sem corpo

  /api/v1/autenticacao/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão atual
      description: >-
        Executa o logout do Spring Security e retorna sem corpo. Aceita a sessão
        do navegador ou o JWT no cabeçalho Authorization: Bearer. O endpoint
        encerra a sessão Spring Security, mas não revoga um JWT já emitido; esse
        token permanece válido até expirar
        (48 horas após a emissão).
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      responses:
        '204':
          description: Logout concluído; não há corpo de resposta
        '401':
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                mensagem: Autenticação necessária.
        '403':
          description: Token CSRF ausente ou inválido; o filtro pode responder sem corpo

  /api/v1/autenticacao/senha/google:
    get:
      tags: [Autenticação]
      summary: Inicia o fluxo Google para criar ou recuperar senha local
      description: >-
        Marca a sessão para que, após a autenticação OAuth2 do
        Google, o navegador seja redirecionado a /definir-senha. A senha é então
        enviada a PUT /api/v1/autenticacao/senha. Esse fluxo cria ou substitui a
        senha local, zera as falhas e remove um bloqueio.
      security: []
      responses:
        '302':
          description: Redirecionamento para iniciar o fluxo Google
          headers:
            Location:
              schema:
                type: string
              description: >-
                /oauth2/authorization/google.

  /api/v1/autenticacao/senha:
    put:
      tags: [Autenticação]
      summary: Cria, redefine ou desbloqueia a senha local
      description: >-
        Requer uma identidade Google autenticada com e-mail verificado vinculada
        a uma conta Rally existente ou autorizada pelas configurações de acesso.
        A operação também aceita um JWT
        emitido pelo backend para essa identidade Google; sessão local sem
        provedor Google não é suficiente. A senha deve ter de 12 a 128 caracteres
        e no máximo 72 bytes em UTF-8. A operação cria ou atualiza a conta local,
        zera o contador de falhas e remove o bloqueio existente. Não há rota
        separada de recuperação: o fluxo GET /api/v1/autenticacao/senha/google
        conduz a esta operação. Cabeçalhos de autenticação de API usam
        o nome HTTP em inglês Authorization, com Bearer para JWT.
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoDefinirSenha'
      responses:
        '204':
          description: Senha definida; não há corpo de resposta
        '400':
          description: Corpo inválido ou senha com mais de 72 bytes em UTF-8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                mensagem: Autenticação necessária.
        '403':
          description: >-
            Identidade Google sem e-mail verificado ou não vinculada a uma conta
            autorizada do Rally; também pode indicar falha de CSRF, que pode
            ser respondida sem corpo pelo filtro Spring Security
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/autenticacao/senha-provisoria:
    put:
      tags: [Autenticação]
      summary: Troca a senha provisória pelo segredo escolhido pela pessoa
      description: >-
        Requer a sessão local criada por um login bem-sucedido com senha
        provisória. Não aceita sessão comum, sessão Google ou JWT. A senha deve
        conter de 12 a 128 caracteres e no máximo 72 bytes em UTF-8. Depois de
        salvar a senha, o servidor encerra a sessão; a pessoa precisa entrar
        novamente com a nova senha. A geração de outra senha provisória invalida
        a senha atual e sessões locais anteriores.
      security:
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoTrocaSenhaProvisoria'
      responses:
        '204':
          description: Senha alterada e sessão encerrada; não há corpo de resposta
        '400':
          description: Corpo inválido, senha com menos de 12 caracteres ou acima de 72 bytes UTF-8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: >-
            A sessão não foi criada por login provisório, a senha já foi trocada,
            ou o token CSRF está ausente ou inválido. A rejeição do filtro pode
            não conter corpo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: Não há senha provisória pendente de troca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/saude:
    get:
      tags: [Saúde]
      summary: Verifica se o serviço está ativo
      security: []
      responses:
        '200':
          description: Serviço disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaSaude'

  /api/v1/nacoes:
    get:
      tags: [Dados do Rally]
      summary: Lista as nações
      responses:
        '200':
          description: Nações cadastradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaNacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/v1/tribos:
    get:
      tags: [Dados do Rally]
      summary: Lista as tribos
      responses:
        '200':
          description: Tribos cadastradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaTribo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/v1/tribos/{id}:
    patch:
      tags: [Dados do Rally]
      summary: Ativa ou desativa uma tribo
      description: >-
        Exige role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto de acesso.
        Define o estado ativo da tribo identificada; a resposta inclui a nação
        à qual ela pertence.
      parameters:
        - $ref: '#/components/parameters/TriboId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoStatusTribo'
      responses:
        '200':
          description: Estado da tribo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaTribo'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/missoes:
    get:
      tags: [Dados do Rally]
      summary: Lista as missões
      responses:
        '200':
          description: Missões cadastradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaMissao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      tags: [Dados do Rally]
      summary: Cria missões a partir de dados revisados
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA. Recebe de 1 a 100
        missões e cria todas na mesma operação, vinculadas a um rally. O campo
        rally_id pode selecionar um rally existente. rally_id e rally são
        mutuamente exclusivos; enviar ambos resulta em 400, e um rally_id sem
        rally correspondente resulta em 404. O objeto rally pode definir nome,
        data_inicio e data_fim; se rally e rally_id forem omitidos, o servidor
        cria um rally com o menor início e o maior fim das missões e nome gerado.
        As datas das missões devem estar dentro do período do rally e a data de
        início de cada missão não pode ser posterior à data de fim. As regras de
        pontuação e campos do relatório podem ser definidos por missão; campos
        podem pertencer ao escopo RELATORIO ou PESSOA, com RELATORIO como padrão.
        Quando regras_pontuacao é omitido ou vazio, são convertidos os campos legados
        de pontos em regras. link_google_forms é
        opcional; quando informado, deve ser um link HTTPS do Google Forms
        aceito pelo serviço (forms.gle/<caminho> ou
        docs.google.com/forms/<caminho>), sem porta explícita nem usuário na
        URL. A autenticação aceita uma sessão Spring Security local ou OAuth2
        Login Google, ou um JWT emitido pelo backend em Authorization: Bearer.
        O papel vem da identidade autenticada, nunca de cabeçalhos definidos pelo
        cliente. A proteção CSRF também se aplica; obtenha o token em
        /api/v1/autenticacao/csrf e envie X-XSRF-TOKEN.
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoCriarMissoes'
      responses:
        '200':
          description: Missões criadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaMissao'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: O período de um novo rally coincide com outro rally cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/rallies:
    get:
      tags: [Dados do Rally]
      summary: Lista rallies cadastrados
      description: >-
        Inclui o indicador ativo calculado pela data atual em
        America/Sao_Paulo. O intervalo de início e fim é inclusivo. O cadastro
        rejeita períodos sobrepostos com 409.
      responses:
        '200':
          description: Rallies em ordem decrescente de data de início
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaRally'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'

    post:
      tags: [Dados do Rally]
      summary: Cadastra um rally
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA. A autenticação aceita
        uma sessão Spring Security local ou OAuth2 Login Google, ou um JWT
        emitido pelo backend em Authorization: Bearer. O papel vem da identidade
        autenticada, nunca de cabeçalhos definidos pelo cliente. A proteção
        CSRF também se aplica; obtenha o token em /api/v1/autenticacao/csrf e
        envie X-XSRF-TOKEN. O período informado não pode se sobrepor ao de outro
        rally cadastrado. A data_inicio deve ser anterior ou igual à data_fim.
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DadosRally'
      responses:
        '201':
          description: Rally criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaRally'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
          description: O período informado coincide com outro rally cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/rallies/{id}:
    delete:
      tags: [Dados do Rally]
      summary: Exclui um rally
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA. A autenticação aceita
        uma sessão Spring Security local ou OAuth2 Login Google, ou um JWT
        emitido pelo backend em Authorization: Bearer. O papel vem da identidade
        autenticada, nunca de cabeçalhos definidos pelo cliente. A proteção
        CSRF também se aplica; obtenha o token em /api/v1/autenticacao/csrf e
        envie X-XSRF-TOKEN. A exclusão remove em cascata as missões do rally,
        formulários públicos específicos, relatórios, respostas, fotos,
        pontuações e demais registros vinculados no banco de dados.
      parameters:
        - $ref: '#/components/parameters/RallyId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      responses:
        '204':
          description: Rally excluído; não há corpo de resposta
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/missoes/{id}:
    delete:
      tags: [Dados do Rally]
      summary: Exclui uma missão
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA. A autenticação aceita
        uma sessão Spring Security local ou OAuth2 Login Google, ou um JWT
        emitido pelo backend em Authorization: Bearer. O papel vem da identidade
        autenticada, nunca de cabeçalhos definidos pelo cliente. A proteção
        CSRF também se aplica; obtenha o token em /api/v1/autenticacao/csrf e
        envie X-XSRF-TOKEN. A exclusão remove em cascata formulários públicos
        específicos, relatórios, respostas, fotos, pessoas pontuadas, metas e
        demais registros vinculados no banco de dados.
      parameters:
        - $ref: '#/components/parameters/MissaoId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      responses:
        '204':
          description: Missão excluída; não há corpo de resposta
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/missoes/interpretar:
    post:
      tags: [Dados do Rally]
      summary: Inicia a interpretação assíncrona de uma mensagem de missões
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA. Envia o texto para a
        IA configurada e aceita a tarefa sem aguardar sua conclusão. Use o UUID
        informado em X-Interpretacao-Id para consultar o estado em
        GET /api/v1/missoes/interpretar/{id} e, se necessário, solicitar o
        cancelamento com DELETE nessa rota. O mesmo identificador enviado
        novamente pelo mesmo usuário retorna a tarefa já registrada. As tarefas
        só podem ser consultadas ou canceladas pelo usuário que as iniciou.
        A interpretação não cria missões. Falhas do modelo, inclusive ausência
        de configuração da integração, aparecem como estado FALHOU na consulta
        da tarefa; 503 nesta operação indica que não foi possível aceitar outra
        tarefa. A identidade e a role vêm da sessão autenticada ou do JWT em
        Authorization: Bearer.
      parameters:
        - $ref: '#/components/parameters/CabecalhoInterpretacaoId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoInterpretacao'
      responses:
        '202':
          description: Tarefa de interpretação aceita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaInterpretacaoAssincrona'
              example:
                id: 00bc39d1-3fa3-4c9f-93ac-06af1a086ee4
                estado: PROCESSANDO
                resultado: null
                mensagem_erro: null
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          description: O UUID informado já pertence a uma tarefa de outro usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '503':
          description: Serviço de interpretação sem capacidade para aceitar outra tarefa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/missoes/interpretar/{id}:
    get:
      tags: [Dados do Rally]
      summary: Consulta o estado de uma interpretação de missões
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA. Somente o usuário que
        iniciou a tarefa pode consultá-la. Quando estado for CONCLUIDA,
        resultado contém as sugestões para revisão; quando for FALHOU,
        mensagem_erro contém a mensagem disponível. Tarefas em estado terminal
        são mantidas temporariamente (5 minutos) e podem deixar de estar
        disponíveis após esse período.
      parameters:
        - $ref: '#/components/parameters/InterpretacaoId'
      responses:
        '200':
          description: Estado atual da tarefa de interpretação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaInterpretacaoAssincrona'
              examples:
                emProcessamento:
                  summary: Interpretação ainda em execução
                  value:
                    id: 00bc39d1-3fa3-4c9f-93ac-06af1a086ee4
                    estado: PROCESSANDO
                    resultado: null
                    mensagem_erro: null
                falhou:
                  summary: Interpretação concluída com falha
                  value:
                    id: 00bc39d1-3fa3-4c9f-93ac-06af1a086ee4
                    estado: FALHOU
                    resultado: null
                    mensagem_erro: Não foi possível interpretar as missões. Tente novamente.
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    delete:
      tags: [Dados do Rally]
      summary: Solicita o cancelamento de uma interpretação
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA e proteção CSRF.
        Uma tarefa existente só pode ser cancelada pelo usuário que a iniciou.
        A solicitação interrompe o worker da tarefa em execução; estados
        terminais não são alterados. Se o UUID ainda não estiver registrado, a
        operação o registra como CANCELADA. A operação não retorna um corpo.
      parameters:
        - $ref: '#/components/parameters/InterpretacaoId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      responses:
        '204':
          description: Solicitação de cancelamento processada; sem corpo de resposta
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          description: O UUID pertence a uma tarefa de outro usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '503':
          description: Serviço sem capacidade para registrar o cancelamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/relatorios:
    get:
      tags: [Relatórios]
      summary: Lista relatórios visíveis para a role do contexto de acesso
      description: >-
        A role e seu escopo são obtidos da identidade autenticada, incluindo do
        JWT apresentado em Authorization: Bearer. ASSISTENTE e
        ADMINISTRADOR_SISTEMA veem todos os relatórios;
        COORDENADOR_TRIBO vê relatórios da própria tribo e
        COORDENADOR_NACAO vê relatórios das tribos da própria nação.
      responses:
        '200':
          description: Relatórios visíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaRelatorio'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
    post:
      tags: [Relatórios]
      summary: Envia um relatório
      description: >-
        Exige role COORDENADOR_TRIBO ou COORDENADOR_NACAO no contexto autenticado
        e permite criar relatório somente para tribo dentro do escopo de
        tribe_id ou nation_id da identidade. O escopo é lido do JWT enviado em
        Authorization: Bearer ou da identidade Spring Security. O corpo aceita
        pessoas e dados dinâmicos definidos pela missão. As chaves de dados
        devem corresponder aos IDs de campos_relatorio do escopo RELATORIO, e
        pessoas[].dados aos IDs do escopo PESSOA; campos não definidos para o
        escopo são rejeitados e os requisitos dos campos são validados. A
        categoria de cada pessoa deve ser INTEGRANTE, NOVO_AFASTADO ou
        CONVIDADO, ou estar declarada em uma regra POR_PESSOA da missão. Se
        uma das quantidades for maior que zero, as pessoas informadas devem
        corresponder às quantidades e categorias; cada pessoa precisa de nome
        e categoria. A comparação de nomes ignora diferenças de caixa e
        normaliza espaços repetidos e nas extremidades, mas preserva acentos.
        Um nome repetido após essa normalização é tratado como pessoa distinta
        e gera um aviso. Como a identificação usa somente o nome, o serviço não
        consegue distinguir homônimos de um reenvio da mesma pessoa. Relatórios
        não possuem operação de edição: após o envio,
        os dados não podem ser ajustados. Para missão que exige foto, use o
        formulário multipart; esta rota JSON não recebe foto. A resposta de
        relatório não inclui nomes de pessoas; os nomes enviados por formulário
        ficam disponíveis apenas nas rotas protegidas de respostas de formulário
        para ASSISTENTE e ADMINISTRADOR_SISTEMA.
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoRelatorio'
      responses:
        '200':
          description: Relatório criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaRelatorio'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/relatorios/{id}/dados-missao:
    get:
      tags: [Relatórios]
      summary: Consulta os dados dinâmicos da missão de um relatório
      description: >-
        Exige role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto autenticado.
        Faz uma consulta somente leitura e retorna os campos dinâmicos definidos
        para a missão separados por escopo: dados contém os campos RELATORIO e
        cada item de pessoas contém apenas os campos PESSOA, além de nome e
        categoria. As chaves dos mapas são os IDs dos campos definidos pela
        missão; campos definidos sem valor são retornados como null. Retorna
        404 quando o relatório não existe.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
      responses:
        '200':
          description: Dados dinâmicos do relatório separados por escopo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaDadosMissaoRelatorio'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/relatorios/{id}/aprovar:
    post:
      tags: [Relatórios]
      summary: Aprova um relatório
      description: >-
        Exige role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto de acesso.
        Somente relatórios no estado ENVIADO podem ser revisados; uma segunda
        tentativa de aprovar ou rejeitar um relatório já revisado retorna 409.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoRevisao'
      responses:
        '200':
          description: Relatório aprovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaRelatorio'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: O relatório já foi revisado e não pode ser alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/relatorios/{id}/rejeitar:
    post:
      tags: [Relatórios]
      summary: Rejeita um relatório
      description: >-
        Exige role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto de acesso.
        Somente relatórios no estado ENVIADO podem ser revisados; uma segunda
        tentativa de aprovar ou rejeitar um relatório já revisado retorna 409.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoRevisao'
      responses:
        '200':
          description: Relatório rejeitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaRelatorio'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: O relatório já foi revisado e não pode ser alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/relatorios/{id}/arquivos:
    post:
      tags: [Relatórios]
      summary: Rota legada para anexar arquivo a um relatório
      description: >-
        A rota não anexa arquivos após o envio do relatório. Após confirmar que
        o relatório existe e que a identidade tem acesso ao escopo da tribo, o
        serviço responde 409 e orienta incluir a foto no envio inicial pelo
        formulário. Para missões que exigem foto, o formulário aceita a imagem
        como parte do envio multipart.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
                  description: >-
                    Parte multipart exigida pela assinatura atual da rota; o
                    conteúdo não é anexado porque o serviço retorna 409 após
                    validar a existência e o escopo do relatório.
      responses:
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: O relatório não aceita arquivos após o envio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/placar:
    get:
      tags: [Dados do Rally]
      summary: Gera o placar das tribos para um Rally
      description: >-
        Quando rally_id é informado, calcula as pontuações do Rally indicado,
        inclusive após o encerramento do período, combinando relatórios
        aprovados e pontuações manuais registradas para esse Rally. Sem este
        parâmetro, mantém o comportamento padrão: considera o rally ativo na
        data atual de America/Sao_Paulo. Depois da data_fim ou na ausência de
        rally ativo, as tribos são retornadas com pontuação zero. Em períodos
        sobrepostos, usa o rally com data_inicio mais recente.
      parameters:
        - name: rally_id
          in: query
          required: false
          description: UUID do Rally cujo placar deve ser consultado.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tribos classificadas por pontuação
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaPlacar'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/regras/interpretar:
    post:
      tags: [Regras]
      summary: Interpreta um texto de regras
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA. Quando a IA não está
        configurada ou falha, o serviço retorna uma interpretação local para
        revisão.
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoInterpretacao'
      responses:
        '200':
          description: Interpretação produzida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaInterpretacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          description: Token CSRF ausente ou inválido; o filtro pode responder sem corpo

  /api/v1/usuarios:
    get:
      tags: [Usuários]
      summary: Lista as contas cadastradas
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA. Retorna todas as contas
        em ordem de e-mail, incluindo o tipo, o papel, o escopo, criada_em e
        ultimo_login_em. ultimo_login_em é null quando não há login registrado.
        Logins anteriores à implantação deste campo não podem ser recuperados,
        portanto contas existentes podem não ter histórico retroativo. Senhas e
        identificadores Google não são incluídos.
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      responses:
        '200':
          description: Contas cadastradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContaGerenciada'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
    post:
      tags: [Usuários]
      summary: Cria uma conta de usuário com papel e escopo
      description: >-
        Requer ASSISTENTE ou ADMINISTRADOR_SISTEMA autenticado, por sessão da
        aplicação ou JWT no cabeçalho HTTP Authorization com o esquema Bearer.
        Um assistente não pode criar ADMINISTRADOR_SISTEMA; somente um
        administrador do sistema pode atribuir esse papel. O e-mail é aparado e
        convertido para minúsculas antes da verificação de unicidade. Para
        COORDENADOR_TRIBO, tribe_id é obrigatório e nation_id deve ser omitido ou
        nulo; para COORDENADOR_NACAO, nation_id é obrigatório e tribe_id deve
        ser omitido ou nulo. O ID informado precisa existir. ASSISTENTE e
        ADMINISTRADOR_SISTEMA não aceitam escopo de tribo ou nação.

        Para account_type LOCAL, envie initial_password com 12 a 128 caracteres
        (até 72 bytes em UTF-8), ou defina gerar_senha_provisoria como true e
        omita initial_password. A senha provisória gerada tem quatro palavras
        curtas separadas por hífens, contém 27 caracteres e é incluída somente
        nesta resposta; o servidor armazena apenas o hash. No primeiro login
        com ela, a pessoa precisa escolher uma senha própria. Se
        gerar_senha_provisoria for omitido ou false, initial_password é
        obrigatório. Para account_type GOOGLE, omita initial_password e não
        defina gerar_senha_provisoria como true; um initial_password não vazio
        ou a geração de senha provisória é rejeitado. A identidade Google é
        vinculada no primeiro login com e-mail verificado correspondente ao
        usuário provisionado.
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoCriacaoUsuario'
      responses:
        '201':
          description: >-
            Conta criada. senha_provisoria contém a senha gerada apenas quando
            gerar_senha_provisoria=true; nos demais casos, é null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaProvisionamento'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
          description: >-
            Já existe uma conta com o e-mail ou o papel conflita com a
            configuração do administrador inicial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/usuarios/{id}:
    put:
      tags: [Usuários]
      summary: Atualiza o papel e o escopo de uma conta
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA. Email e account_type
        são imutáveis nesta operação. O assistente não pode editar contas de
        ADMINISTRADOR_SISTEMA nem atribuir esse papel; somente um administrador
        do sistema pode fazê-lo. Para COORDENADOR_TRIBO, tribe_id é obrigatório
        e nation_id deve ser omitido ou nulo; para COORDENADOR_NACAO, nation_id
        é obrigatório e tribe_id deve ser omitido ou nulo. ASSISTENTE e
        ADMINISTRADOR_SISTEMA não aceitam escopo. A tribo ou nação precisa
        existir. O administrador inicial e o último administrador do sistema
        não podem perder esse papel.
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizacaoUsuario'
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContaGerenciada'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: O administrador inicial ou o último administrador não pode perder seu papel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      tags: [Usuários]
      summary: Exclui uma conta
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA. Assistentes não podem
        excluir contas de ADMINISTRADOR_SISTEMA. Não é permitido excluir a
        própria conta, o administrador inicial configurado ou o último
        administrador do sistema. A exclusão também revoga a identidade Google
        e o e-mail cadastrados para impedir novo acesso ou provisionamento
        automático.
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      responses:
        '204':
          description: Conta excluída; não há corpo de resposta
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: A conta não pode ser excluída por ser própria, inicial ou o último administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/usuarios/{id}/senha-provisoria:
    post:
      tags: [Usuários]
      summary: Gera uma senha provisória para uma conta local
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA. Uma senha nova é
        gerada para uma conta LOCAL, invalida a senha anterior e sessões
        locais emitidas antes da redefinição e marca a próxima autenticação
        como provisória. A senha contém quatro palavras curtas separadas por
        hífens (27 caracteres). Ela aparece apenas nesta resposta; o servidor
        persiste somente o hash. No login seguinte, a pessoa deve defini-la
        novamente antes de usar outras rotas privadas. Assistentes não podem
        redefinir senhas de contas ADMINISTRADOR_SISTEMA.
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      responses:
        '200':
          description: Senha provisória gerada; este é o único retorno do segredo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaSenhaProvisoria'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          description: Conta local não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/usuarios/{email}/role:
    put:
      tags: [Usuários]
      summary: Define a role e o escopo de um usuário
      description: >-
        Requer a role ADMINISTRADOR_SISTEMA no contexto autenticado; aceita a
        sessão da aplicação ou JWT no cabeçalho HTTP Authorization com o esquema
        Bearer. Para COORDENADOR_TRIBO, tribe_id é obrigatório e nation_id deve
        ser omitido;
        para COORDENADOR_NACAO, nation_id é obrigatório e tribe_id deve ser
        omitido. ASSISTENTE e ADMINISTRADOR_SISTEMA não aceitam IDs de escopo.
        Os IDs de tribo ou nação precisam existir. O administrador inicial
        definido pela configuração não pode perder ADMINISTRADOR_SISTEMA. O
        e-mail do caminho é aparado e normalizado para minúsculas; a operação
        cria ou atualiza o perfil de acesso.
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/EmailUsuario'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoPapel'
            examples:
              coordenadorTribo:
                summary: Coordenador vinculado a uma tribo
                value:
                  role: COORDENADOR_TRIBO
                  tribe_id: 11111111-1111-1111-1111-111111111111
                  nation_id: null
              coordenadorNacao:
                summary: Coordenador vinculado a uma nação
                value:
                  role: COORDENADOR_NACAO
                  tribe_id: null
                  nation_id: 22222222-2222-2222-2222-222222222222
      responses:
        '200':
          description: Role e escopo atribuídos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaUsuario'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
          description: O administrador inicial configurado não pode perder sua role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/formularios:
    get:
      tags: [Formulários]
      summary: Lista formulários públicos cadastrados
      description: >-
        Exige role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto de acesso.
        Uma sessão Google precisa ter e-mail verificado e estar autorizada;
        também é aceito JWT em Authorization: Bearer.
      responses:
        '200':
          description: Formulários cadastrados, inclusive token de acesso público
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Formulario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
    post:
      tags: [Formulários]
      summary: Cria um formulário público para receber relatórios do período
      description: >-
        ASSISTENTE ou ADMINISTRADOR_SISTEMA pode criar a definição com até 30
        campos. rally_id é obrigatório quando missao_id não é informado; se
        ambos forem enviados, a missão precisa pertencer ao rally. O link
        permite consultar catálogos e
        enviar relatórios apenas para missões cadastradas nesse rally. missao_id
        é opcional para compatibilidade com formulários vinculados a uma única
        missão. IDs dos campos definidos no formulário devem ser únicos e não
        podem ser nomes_integrantes, nomes_novos_afastados ou preenchido_por.
        Campo do tipo selecao precisa conter pelo menos uma opção.
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinicaoFormulario'
            example:
              rally_id: 00000000-0000-4000-8000-000000000010
              titulo: Relatório mensal
              descricao: Relatórios das missões realizadas neste mês.
              campos: []
      responses:
        '200':
          description: Formulário criado com token público gerado pelo servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Formulario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/formularios/{id}/desativar:
    post:
      tags: [Formulários]
      summary: Desativa um formulário público
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto de acesso.
      parameters:
        - $ref: '#/components/parameters/FormularioId'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      responses:
        '200':
          description: >-
            Requisição concluída sem corpo. O controller não verifica se o UUID
            correspondeu a um formulário existente.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/publico/formularios/{token}:
    get:
      tags: [Formulários públicos]
      summary: Consulta a definição de um formulário público ativo
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenFormulario'
      responses:
        '200':
          description: >-
            Definição do formulário, nações com tribos ativas, tribos ativas e
            missões do rally associado. Cada missão contém apenas os dados
            necessários para o envio: id, nome, exigência de foto e campos do
            relatório. Formulários antigos sem rally_id mantêm o escopo legado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormularioPublico'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/publico/formularios/{token}/respostas:
    post:
      tags: [Formulários públicos]
      summary: Envia um relatório usando a chave pública do link
      description: >-
        Qualquer pessoa com a chave de 256 bits no caminho da URL pode enviar;
        login não é exigido. A chave autoriza somente o envio para missões do
        rally associado e não permite consultar relatórios ou respostas. O
        servidor valida a associação da missão ao rally, se a tribo está ativa
        e se ela pertence à nação informada. A proteção CSRF continua habilitada.
        A parte dados é JSON e deve incluir relatorio, nacao_id, preenchido_por
        e respostas adicionais. relatorio.missao_id é escolhido neste envio.
        Se a definição do formulário tiver missao_id, ele precisa corresponder
        à missão escolhida. Quando usado o formato legado de listas de nomes,
        as quantidades em relatorio devem corresponder às linhas não vazias;
        uma linha contendo apenas "nenhum" (sem diferenciar maiúsculas) não
        conta. Como alternativa, relatorio.pessoas pode trazer objetos com nome,
        categoria e dados estruturados por ID; nesse caso, as quantidades devem
        corresponder às categorias dessas pessoas. Se relatorio.pessoas for
        omitido ou vazio, nomes_integrantes e nomes_novos_afastados são
        necessários para gerar as pessoas com categorias padrão. Campos de
        escopo RELATORIO vão em respostas e campos de escopo PESSOA vão em
        relatorio.pessoas[].dados. As respostas devem usar IDs definidos no
        formulário, ter até 5.000 caracteres cada e respeitar os campos
        obrigatórios; valores do tipo numero devem ser decimais válidos e
        selecao deve corresponder a uma das opções definidas. Definições
        podem conter até 30 campos adicionais. Após o envio, o relatório e as
        respostas não podem ser editados.
        preenchido_por é obrigatório. A parte arquivo é opcional quando a missão não exige
        foto e obrigatória quando exige; aceita no máximo uma imagem JPEG,
        PNG ou WebP de até 5 MiB (5.242.880 bytes). Os valores fixos de
        nomes e responsável
        são gravados também em respostas sob as chaves
        nomes_integrantes, nomes_novos_afastados e preenchido_por.
        nacao_id deve corresponder à nação da tribo informada; missao_id deve
        identificar uma missão existente. O conteúdo da foto também precisa
        corresponder ao MIME type declarado. O arquivo deve ser JPEG, PNG ou
        WebP; o nome e a extensão do arquivo não determinam o formato aceito.
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenFormulario'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [dados]
              properties:
                dados:
                  $ref: '#/components/schemas/EnvioFormulario'
                arquivo:
                  type: string
                  format: binary
                  description: >-
                    Opcional salvo quando a missão selecionada exige foto. Se
                    enviada, deve ser uma única imagem JPEG, PNG ou WebP com
                    até 5 MiB (5.242.880 bytes); o conteúdo precisa corresponder
                    ao tipo informado.
            encoding:
              arquivo:
                contentType: image/jpeg, image/png, image/webp
              dados:
                contentType: application/json
      responses:
        '200':
          description: Relatório criado, com avisos de nomes repetidos quando aplicável
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaEnvioFormulario'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '403':
          description: Token CSRF ausente ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/formularios/respostas/{id}:
    get:
      tags: [Formulários]
      summary: Consulta respostas do formulário recebidas pela assistente
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto de acesso.
        O mapa respostas contém os valores fixos
        nomes_integrantes, nomes_novos_afastados e preenchido_por, além das
        respostas adicionais. Registros antigos podem continuar trazendo
        missao_id na definição. O acesso aos nomes,
        às respostas e à presença de foto fica restrito às roles ASSISTENTE e
        ADMINISTRADOR_SISTEMA.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
      responses:
        '200':
          description: >-
            Respostas associadas ao relatório. Se não houver resposta de
            formulário para o identificador, retorna uma lista vazia.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaFormulario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/formularios/respostas/{id}/foto:
    get:
      tags: [Formulários]
      summary: Obtém a foto enviada com as respostas
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA no contexto de acesso.
        Somente essas roles acessam a imagem pessoal.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
      responses:
        '200':
          description: Bytes da imagem armazenada
          headers:
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Envie o access_token no cabeçalho HTTP Authorization: Bearer. O servidor
        valida o JWT HS256, o emissor, a audiência e a validade temporal. Tokens
        emitidos pelo backend expiram 48 horas após a emissão.
    sessaoAplicacao:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >-
        Cookie de sessão do Spring Security após login local ou OAuth2 Login do
        Google. O cookie é HttpOnly, SameSite=Lax e Secure conforme a
        configuração da sessão; as rotas privadas exigem sessão ou JWT.
  parameters:
    CabecalhoCsrf:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: >-
        Token obtido do cookie XSRF-TOKEN após consultar GET
        /api/v1/autenticacao/csrf. A proteção CSRF também se aplica ao envio de
        formulário sob /api/v1/publico/formularios, mesmo quando a pessoa não
        está autenticada. Envie o cabeçalho e o cookie XSRF-TOKEN em métodos de
        escrita; o cookie de sessão também acompanha as requisições quando
        houver sessão autenticada.
      schema:
        type: string
    CabecalhoInterpretacaoId:
      name: X-Interpretacao-Id
      in: header
      required: true
      description: >-
        UUID escolhido pelo cliente para identificar a tarefa. Reenvios do POST
        com o mesmo UUID pelo mesmo usuário retornam a tarefa já registrada.
      schema:
        type: string
        format: uuid
    EmailUsuario:
      name: email
      in: path
      required: true
      description: E-mail do usuário cuja role e escopo serão definidos.
      schema:
        type: string
    UsuarioId:
      name: id
      in: path
      required: true
      description: Identificador UUID da conta de usuário.
      schema:
        type: string
        format: uuid
    RelatorioId:
      name: id
      in: path
      required: true
      description: Identificador UUID do relatório.
      schema:
        type: string
        format: uuid
    TriboId:
      name: id
      in: path
      required: true
      description: Identificador UUID da tribo.
      schema:
        type: string
        format: uuid
    MissaoId:
      name: id
      in: path
      required: true
      description: Identificador UUID da missão.
      schema:
        type: string
        format: uuid
    InterpretacaoId:
      name: id
      in: path
      required: true
      description: Identificador UUID da tarefa de interpretação.
      schema:
        type: string
        format: uuid
    RallyId:
      name: id
      in: path
      required: true
      description: Identificador UUID do rally.
      schema:
        type: string
        format: uuid
    FormularioId:
      name: id
      in: path
      required: true
      description: Identificador UUID do formulário.
      schema:
        type: string
        format: uuid
    TokenFormulario:
      name: token
      in: path
      required: true
      description: Chave pública hexadecimal de 64 caracteres incluída no link compartilhado.
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
  responses:
    NaoAutenticado:
      description: >-
        Autenticação necessária. A API retorna application/json com a propriedade
        mensagem.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            mensagem: Autenticação necessária.
    ErroRequisicao:
      description: >-
        Requisição inválida. Erros de negócio tratados pela API incluem a
        propriedade mensagem; erros automáticos de validação seguem o formato
        do Spring e podem incluir outras propriedades.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    AcessoNegado:
      description: >-
        Acesso negado para o papel ou escopo atual. Erros de autorização tratados
        pelos serviços retornam JSON com mensagem. Falhas CSRF ou rejeições pelo
        filtro Spring Security podem ser respondidas sem corpo JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Recurso inexistente ou formulário público inválido ou desativado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    RequisicaoLogin:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
          description: E-mail aparado e convertido para minúsculas antes da consulta.
        senha:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Senha da conta local. Além do limite de 128 caracteres, o endpoint
            rejeita valores com mais de 72 bytes em UTF-8.
    RequisicaoDefinirSenha:
      type: object
      required: [senha]
      properties:
        senha:
          type: string
          minLength: 12
          maxLength: 128
          description: >-
            Nova senha local. Além do intervalo de 12 a 128 caracteres, o
            endpoint rejeita valores com mais de 72 bytes em UTF-8.
    RequisicaoTrocaSenhaProvisoria:
      type: object
      required: [senha]
      properties:
        senha:
          type: string
          minLength: 12
          maxLength: 128
          description: >-
            Senha escolhida pela pessoa. Deve conter de 12 a 128 caracteres e
            no máximo 72 bytes em UTF-8.
    PapelUsuario:
      type: string
      enum: [ASSISTENTE, COORDENADOR_TRIBO, COORDENADOR_NACAO, ADMINISTRADOR_SISTEMA]
    TipoContaUsuario:
      type: string
      enum: [LOCAL, GOOGLE]
    RequisicaoCriacaoUsuario:
      type: object
      required: [email, role, account_type]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
          description: E-mail único; aparado e convertido para minúsculas antes do cadastro.
        role:
          $ref: '#/components/schemas/PapelUsuario'
        tribe_id:
          type: string
          format: uuid
          nullable: true
          description: Obrigatório para COORDENADOR_TRIBO; deve ser omitido ou nulo para outros papéis.
        nation_id:
          type: string
          format: uuid
          nullable: true
          description: Obrigatório para COORDENADOR_NACAO; deve ser omitido ou nulo para outros papéis.
        account_type:
          $ref: '#/components/schemas/TipoContaUsuario'
        initial_password:
          type: string
          minLength: 12
          maxLength: 128
          description: >-
            Obrigatória para account_type LOCAL, com mínimo de 12 caracteres e
            máximo de 72 bytes UTF-8. A senha é codificada com o PasswordEncoder
            configurado antes do armazenamento. Deve ser omitida para GOOGLE;
            um valor não vazio é rejeitado.
        gerar_senha_provisoria:
          type: boolean
          description: >-
            Quando true para conta LOCAL, gera uma senha provisória na resposta
            e exige que ela seja trocada no primeiro login. Nesse caso, omita
            initial_password. Omitido ou false exige initial_password em contas
            locais; não se aplica a contas GOOGLE.
    RespostaProvisionamento:
      type: object
      required: [id, email, role, tribe_id, nation_id, account_type, senha_provisoria]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/PapelUsuario'
        tribe_id:
          type: string
          format: uuid
          nullable: true
        nation_id:
          type: string
          format: uuid
          nullable: true
        account_type:
          $ref: '#/components/schemas/TipoContaUsuario'
        senha_provisoria:
          type: string
          nullable: true
          description: >-
            Senha em texto claro somente quando foi gerada para esta criação;
            null nos demais casos. Ela não pode ser consultada depois desta
            resposta.
    AtualizacaoUsuario:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/PapelUsuario'
        tribe_id:
          type: string
          format: uuid
          nullable: true
          description: Obrigatório para COORDENADOR_TRIBO; deve ser omitido ou nulo para os outros papéis.
        nation_id:
          type: string
          format: uuid
          nullable: true
          description: Obrigatório para COORDENADOR_NACAO; deve ser omitido ou nulo para os outros papéis.
    ContaGerenciada:
      type: object
      required: [id, email, role, tribe_id, nation_id, account_type, criada_em, ultimo_login_em]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/PapelUsuario'
        tribe_id:
          type: string
          format: uuid
          nullable: true
        nation_id:
          type: string
          format: uuid
          nullable: true
        account_type:
          $ref: '#/components/schemas/TipoContaUsuario'
        criada_em:
          type: string
          format: date-time
          description: Data e hora em que a conta Rally foi cadastrada.
        ultimo_login_em:
          type: string
          format: date-time
          nullable: true
          description: >-
            Data e hora do último login registrado; null quando não há registro.
            Contas existentes podem não ter histórico anterior à V16.
    RespostaSenhaProvisoria:
      type: object
      required: [senha_provisoria]
      properties:
        senha_provisoria:
          type: string
          minLength: 27
          maxLength: 27
          description: >-
            Gerada por SecureRandom como quatro palavras fonéticas separadas
            por hífens (27 caracteres). O segredo é retornado apenas nesta
            operação e o servidor persiste somente seu hash.
    RespostaSessao:
      type: object
      description: >-
        Role é o papel do usuário. Para COORDENADOR_TRIBO, tribe_id informa o
        escopo; para COORDENADOR_NACAO, nation_id informa o escopo. Os dois IDs
        são null para ASSISTENTE e ADMINISTRADOR_SISTEMA. Não há uma propriedade
        JSON separada chamada scope.
      required: [autenticado, email, nome, provedor, email_verificado, role, tribe_id, nation_id, access_token, troca_senha_obrigatoria]
      properties:
        autenticado:
          type: boolean
        email:
          type: string
          nullable: true
          description: Nulo para sessão anônima.
        nome:
          type: string
          nullable: true
        provedor:
          type: string
          enum: [GOOGLE, LOCAL]
          nullable: true
        email_verificado:
          type: boolean
        role:
          type: string
          enum: [ASSISTENTE, COORDENADOR_TRIBO, COORDENADOR_NACAO, ADMINISTRADOR_SISTEMA]
          nullable: true
          description: Nulo para uma sessão anônima.
        tribe_id:
          type: string
          format: uuid
          nullable: true
          description: Escopo da role COORDENADOR_TRIBO; nulo para as demais roles.
        nation_id:
          type: string
          format: uuid
          nullable: true
          description: Escopo da role COORDENADOR_NACAO; nulo para as demais roles.
        access_token:
          type: string
          nullable: true
          description: >-
            JWT de acesso, válido por 48 horas; null para sessão anônima e para
            uma sessão local autenticada com senha provisória.
        troca_senha_obrigatoria:
          type: boolean
          description: >-
            true na sessão local aberta com senha provisória até a pessoa
            escolher uma nova senha.
    RequisicaoPapel:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/PapelUsuario'
        tribe_id:
          type: string
          format: uuid
          nullable: true
          description: Obrigatório para COORDENADOR_TRIBO; deve ser omitido ou nulo para outras roles.
        nation_id:
          type: string
          format: uuid
          nullable: true
          description: Obrigatório para COORDENADOR_NACAO; deve ser omitido ou nulo para outras roles.
    RespostaUsuario:
      type: object
      required: [id, email, role, tribe_id, nation_id]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/PapelUsuario'
        tribe_id:
          type: string
          format: uuid
          nullable: true
        nation_id:
          type: string
          format: uuid
          nullable: true
    Erro:
      type: object
      description: >-
        Erros tratados explicitamente pela API usam a propriedade mensagem.
        Respostas de validação automática do Spring podem incluir outras
        propriedades, pois seguem o formato padrão do framework.
      additionalProperties: true
      properties:
        mensagem:
          type: string
          description: Mensagem da falha retornada pelo handler de exceções da API.
    RespostaSaude:
      type: object
      required: [status, servico, idioma]
      properties:
        status:
          type: string
          example: ok
        servico:
          type: string
          example: servico-rally
        idioma:
          type: string
          example: pt-BR
    RespostaNacao:
      type: object
      required: [id, nome]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
    RespostaTribo:
      type: object
      required: [id, nome, ativa, nacao_id, nacao_nome]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        ativa:
          type: boolean
        nacao_id:
          type: string
          format: uuid
        nacao_nome:
          type: string
    RespostaMissao:
      type: object
      required:
        - id
        - nome
        - descricao
        - data_inicio
        - data_fim
        - prazo_envio
        - pontos_por_pessoa
        - pontos_por_novo_afastado
        - bonificacao_a_cada_cinco_novos
        - meta_nacional
        - bonificacao_meta_nacional
        - exige_foto
        - tipo_pessoa
        - link_google_forms
        - status
        - versao
        - rally_id
        - rally_nome
        - regras_pontuacao
        - campos_relatorio
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        descricao:
          type: string
          nullable: true
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date
        prazo_envio:
          type: string
          description: Data e hora local de São Paulo, sem offset de fuso horário; pode ser nulo.
          nullable: true
        pontos_por_pessoa:
          type: integer
        pontos_por_novo_afastado:
          type: integer
        bonificacao_a_cada_cinco_novos:
          type: integer
        meta_nacional:
          type: integer
        bonificacao_meta_nacional:
          type: integer
        exige_foto:
          type: boolean
        tipo_pessoa:
          type: string
        link_google_forms:
          type: string
          maxLength: 2048
          nullable: true
          description: Link HTTPS opcional associado à missão.
        status:
          type: string
        versao:
          type: integer
        rally_id:
          type: string
          format: uuid
        rally_nome:
          type: string
          nullable: true
        regras_pontuacao:
          type: array
          description: Regras normalizadas armazenadas para esta missão.
          items:
            $ref: '#/components/schemas/RegraPontuacao'
        campos_relatorio:
          type: array
          description: Campos adicionais esperados no relatório da missão.
          items:
            $ref: '#/components/schemas/CampoRelatorioMissao'
    RespostaRally:
      type: object
      required: [id, nome, data_inicio, data_fim, ativo]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date
        ativo:
          type: boolean
          description: >-
            true quando a data atual em America/Sao_Paulo estiver entre
            data_inicio e data_fim, inclusive.
    DadosRally:
      type: object
      required: [nome, data_inicio, data_fim]
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 180
          description: Não pode estar vazio nem ser composto apenas por espaços.
        data_inicio:
          type: string
          format: date
          description: Deve ser anterior ou igual a data_fim.
        data_fim:
          type: string
          format: date
    CampoRelatorioMissao:
      type: object
      description: >-
        O serviço valida que id, titulo e tipo sejam textos não vazios, que id
        seja único na missão e que tipo seja um dos valores listados. Campos
        podem pertencer ao escopo RELATORIO ou PESSOA; o padrão é RELATORIO.
        O identificador categoria não pode ser usado como campo PESSOA.
        Campos opcionais adicionais podem ser preservados como dados JSON.
      required: [id, titulo, tipo]
      properties:
        id:
          type: string
        titulo:
          type: string
        tipo:
          type: string
          enum: [texto, paragrafo, numero, selecao]
          description: >-
            Para qualquer campo do tipo numero, em qualquer escopo, o valor
            informado deve estar entre 0 e 1.000.000, inclusive.
        escopo:
          type: string
          enum: [RELATORIO, PESSOA]
          default: RELATORIO
      additionalProperties: true
    RequisicaoStatusTribo:
      type: object
      required: [ativa]
      properties:
        ativa:
          type: boolean
          description: >-
            true ativa a tribo; false a desativa.
    RequisicaoRelatorio:
      type: object
      required: [missao_id, tribo_id]
      properties:
        missao_id:
          type: string
          format: uuid
        tribo_id:
          type: string
          format: uuid
        quantidade_pessoas:
          type: integer
          minimum: 0
          maximum: 200
          description: Deve corresponder ao número de pessoas de categoria integrante (ou outra categoria não classificada como nova/afastada).
        quantidade_novos_afastados:
          type: integer
          minimum: 0
          maximum: 200
          description: Deve corresponder às pessoas cuja categoria é NOVO_AFASTADO, começa com NOVO_ ou começa com AFASTADO_.
        observacoes:
          type: string
          nullable: true
        pessoas:
          type: array
          maxItems: 400
          description: >-
            Lista de pessoas considerada na pontuação. Quando qualquer
            quantidade for maior que zero, a lista é obrigatória e deve
            corresponder às quantidades por categoria. A comparação de nomes
            ignora caixa e normaliza espaços repetidos e nas extremidades, mas
            preserva acentos. Nomes repetidos após essa normalização são
            mantidos como pessoas distintas e geram aviso; a API não consegue
            identificar homônimos ou reenvios usando só nome.
          items:
            $ref: '#/components/schemas/PessoaRelatorio'
        dados:
          allOf:
            - $ref: '#/components/schemas/DadosDinamicosRelatorio'
          description: >-
            Na criação do relatório, as chaves devem ser IDs dos campos
            campos_relatorio com escopo RELATORIO; campos não definidos nesse
            escopo são rejeitados.
    PessoaRelatorio:
      type: object
      required: [nome, categoria]
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 200
        categoria:
          type: string
          minLength: 1
          maxLength: 80
          description: >-
            Espaços e hífens viram `_`, e o valor é normalizado para maiúsculas.
            Aceita as categorias padrão INTEGRANTE, NOVO_AFASTADO e CONVIDADO,
            ou uma categoria declarada em uma regra POR_PESSOA da missão.
            JOVEM_FIRME é normalizada para INTEGRANTE; NOVO e AFASTADO são
            normalizados para NOVO_AFASTADO. Categorias com prefixo NOVO_ ou
            AFASTADO_ contam como novos/afastados.
        dados:
          allOf:
            - $ref: '#/components/schemas/DadosDinamicosRelatorio'
          description: >-
            Na criação do relatório, as chaves devem ser IDs dos campos
            campos_relatorio com escopo PESSOA; campos não definidos nesse
            escopo são rejeitados.
    DadosDinamicosRelatorio:
      type: object
      maxProperties: 50
      description: >-
        Valores simples usados pelas condições e métricas de pontuação. Chaves
        têm até 80 caracteres e valores de texto até 5.000 caracteres. Ao criar
        um relatório, as chaves precisam corresponder a campos_relatorio no
        escopo do mapa (RELATORIO ou PESSOA); IDs desconhecidos são rejeitados.
        Respostas a campos do tipo numero aceitam somente valores entre 0 e
        1.000.000, inclusive, tanto no escopo RELATORIO quanto PESSOA.
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 5000
          - type: number
          - type: boolean
    RespostaRelatorio:
      type: object
      required:
        - id
        - missao_id
        - missao_nome
        - tribo_id
        - tribo_nome
        - nacao_nome
        - quantidade_pessoas
        - quantidade_novos_afastados
        - observacoes
        - enviado_em
        - atrasado
        - status
        - pontos_aprovados
        - justificativa_revisao
        - avisos
      properties:
        id:
          type: string
          format: uuid
        missao_id:
          type: string
          format: uuid
        missao_nome:
          type: string
        tribo_id:
          type: string
          format: uuid
        tribo_nome:
          type: string
        nacao_nome:
          type: string
        quantidade_pessoas:
          type: integer
        quantidade_novos_afastados:
          type: integer
        observacoes:
          type: string
          nullable: true
        enviado_em:
          type: string
          description: Data e hora local de São Paulo, sem offset de fuso horário.
        atrasado:
          type: boolean
        status:
          type: string
          enum: [ENVIADO, APROVADO, REJEITADO]
        pontos_aprovados:
          type: integer
        justificativa_revisao:
          type: string
          nullable: true
        avisos:
          type: array
          items:
            $ref: '#/components/schemas/AvisoRelatorio'
    RespostaDadosMissaoRelatorio:
      type: object
      required: [dados, pessoas]
      description: >-
        Dados dinâmicos persistidos para a missão do relatório, separados pelos
        escopos definidos em campos_relatorio. Cada mapa inclui as chaves
        declaradas para o respectivo escopo; valores não informados aparecem
        como null. Campos desconhecidos ou pertencentes ao outro escopo não
        são retornados.
      properties:
        dados:
          type: object
          description: Valores dos campos definidos com escopo RELATORIO, indexados pelo ID.
          additionalProperties: true
        pessoas:
          type: array
          description: Pessoas associadas ao relatório com seus campos de escopo PESSOA.
          items:
            $ref: '#/components/schemas/PessoaDadosMissaoRelatorio'
    PessoaDadosMissaoRelatorio:
      type: object
      required: [nome, categoria, dados]
      properties:
        nome:
          type: string
        categoria:
          type: string
        dados:
          type: object
          description: Valores dos campos definidos com escopo PESSOA, indexados pelo ID.
          additionalProperties: true
    AvisoRelatorio:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo:
          type: string
          example: NOME_REPETIDO_NA_MISSAO
        mensagem:
          type: string
    RequisicaoRevisao:
      type: object
      properties:
        justificativa:
          type: string
          nullable: true
    RespostaPlacar:
      type: object
      required: [posicao, tribo_id, tribo_nome, nacao_nome, pontos, pessoas_aprovadas, relatorios_aprovados, bonus_nacional]
      properties:
        posicao:
          type: integer
        tribo_id:
          type: string
          format: uuid
        tribo_nome:
          type: string
        nacao_nome:
          type: string
        pontos:
          type: integer
          format: int64
        pessoas_aprovadas:
          type: integer
          format: int64
        relatorios_aprovados:
          type: integer
          format: int64
        bonus_nacional:
          type: integer
          format: int64
    RequisicaoInterpretacao:
      type: object
      required: [texto]
      properties:
        texto:
          type: string
          minLength: 1
          maxLength: 40000
          description: Texto não vazio nem composto apenas por espaços.
    DadosMissao:
      type: object
      required:
        - nome
        - data_inicio
        - data_fim
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 180
          description: Não pode ser vazio ou composto apenas por espaços.
        descricao:
          type: string
          maxLength: 10000
          nullable: true
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date
        prazo_envio:
          type: string
          description: Data e hora local de São Paulo, sem offset de fuso horário.
          nullable: true
        pontos_por_pessoa:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000000
        pontos_por_novo_afastado:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000000
        bonificacao_a_cada_cinco_novos:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000000
        meta_nacional:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000000
        bonificacao_meta_nacional:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000000
        exige_foto:
          type: boolean
        tipo_pessoa:
          type: string
          enum: [integrante, novo_ou_afastado]
          nullable: true
        link_google_forms:
          type: string
          maxLength: 2048
          nullable: true
          description: >-
            Opcional. Se não for nulo nem vazio, deve ser um link HTTPS de
            forms.gle/<caminho> ou docs.google.com/forms/<caminho>; espaços
            nas extremidades são removidos antes de salvar.
        regras_pontuacao:
          type: array
          maxItems: 100
          description: >-
            Regras dinâmicas de pontuação. Se omitida ou vazia, as propriedades
            legadas de pontuação acima são convertidas para regras equivalentes.
          items:
            $ref: '#/components/schemas/RegraPontuacao'
        campos_relatorio:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/CampoRelatorioMissao'
    RegraPontuacao:
      type: object
      description: >-
        Regra dinâmica de uma missão. `tipo` seleciona o formato aplicável:
        POR_PESSOA exige categoria e pontos; POR_QUANTIDADE exige campo e
        pontos_por_unidade; POR_RELATORIO exige pontos; A_CADA e META exigem
        campo, escopo, quantidade e pontos; FAIXAS exige campo, escopo e faixas;
        META_COMPOSTA exige escopo, pontos e condicao_agregada; a condição
        agregada combina contagens somadas separadamente no escopo por meio de
        grupos todas (AND) e alguma (OR), com folhas numéricas; pode usar
        quando_pessoa numa folha para filtrar uma contagem de pessoas;
        PERCENTUAL exige campo, campo_base, percentual e pontos;
        FAIXAS_PERCENTUAIS exige campo, campo_base, escopo e faixas. As regras
        percentuais somam numerador e denominador por TRIBO ou NACAO; com base
        agregada zero, não concedem pontos. `quando` é opcional. Campos extras
        são preservados na configuração.
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [POR_PESSOA, POR_QUANTIDADE, POR_RELATORIO, A_CADA, META, META_COMPOSTA, FAIXAS, PERCENTUAL, FAIXAS_PERCENTUAIS, PONTOS_POR_PESSOA, PONTOS_POR_QUANTIDADE, BONUS_A_CADA, BONUS_META, BONUS_META_COMPOSTA, BONUS_FAIXAS]
          description: >-
            Tipos canônicos aceitos: POR_PESSOA, POR_QUANTIDADE, POR_RELATORIO,
            A_CADA, META, META_COMPOSTA, FAIXAS, PERCENTUAL e
            FAIXAS_PERCENTUAIS. Os aliases PONTOS_POR_PESSOA,
            PONTOS_POR_QUANTIDADE, BONUS_A_CADA, BONUS_META,
            BONUS_META_COMPOSTA e BONUS_FAIXAS são normalizados para os tipos
            canônicos correspondentes ao criar a missão; sugestões da IA
            podem preservar o valor que ela produziu.
        categoria:
          type: string
        pontos:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Pontos concedidos; obrigatório para META_COMPOSTA.
        campo:
          type: string
          description: >-
            Métricas internas aceitas incluem integrantes, pessoas,
            total_pessoas, novos_afastados, novos, afastados e convidados;
            outros nomes devem identificar campos numéricos do escopo RELATORIO.
            Em PERCENTUAL e FAIXAS_PERCENTUAIS, é o numerador.
        campo_base:
          type: string
          description: >-
            Denominador de PERCENTUAL e FAIXAS_PERCENTUAIS. Assim como campo,
            deve ser uma contagem suportada ou identificar um campo do tipo
            numero no escopo RELATORIO.
        pontos_por_unidade:
          type: integer
          minimum: 0
          maximum: 1000000
        percentual:
          type: number
          minimum: 0
          maximum: 100
          description: >-
            Limite percentual de PERCENTUAL, entre 0 e 100 inclusive; os pontos
            são concedidos quando a razão agregada campo/campo_base atinge esse
            limite.
        quantidade:
          type: integer
          minimum: 1
          maximum: 1000000
        escopo:
          type: string
          enum: [TRIBO, NACAO]
          description: >-
            Obrigatório em META_COMPOSTA. TRIBO agrega por tribo; NACAO agrega
            por nação e soma o bônus às tribos da nação.
        distribuir_para:
          type: string
          enum: [TRIBOS, TRIBO_GERADORA]
          description: >-
            Para escopo NACAO, TRIBOS distribui o bônus às tribos da nação e
            TRIBO_GERADORA somente às tribos com relatórios aprovados na missão.
        faixas:
          type: array
          minItems: 1
          maxItems: 30
          description: >-
            Para FAIXAS, cada item usa minimo e pontos. Para
            FAIXAS_PERCENTUAIS, cada item usa minimo_percentual e pontos; os
            limites percentuais precisam ser únicos e estar entre 0 e 100.
          items:
            anyOf:
              - $ref: '#/components/schemas/FaixaPontuacao'
              - $ref: '#/components/schemas/FaixaPercentual'
        estrategia:
          type: string
          enum: [MAIOR_FAIXA, CUMULATIVA]
          description: >-
            Para FAIXAS e FAIXAS_PERCENTUAIS, CUMULATIVA soma os pontos de
            todas as faixas atingidas; MAIOR_FAIXA usa os pontos da faixa mais
            alta atingida. O padrão é MAIOR_FAIXA.
          default: MAIOR_FAIXA
        quando:
          allOf:
            - $ref: '#/components/schemas/CondicaoPontuacao'
          description: >-
            Condição opcional. Em POR_PESSOA, os testes usam dados da pessoa
            por padrão; defina origem RELATORIO explicitamente para testar os
            dados do relatório. Nas demais regras, a origem padrão é RELATORIO.
        quando_pessoa:
          allOf:
            - $ref: '#/components/schemas/CondicaoPontuacao'
          description: >-
            Filtro por pessoa para POR_QUANTIDADE, A_CADA, META, FAIXAS,
            PERCENTUAL ou FAIXAS_PERCENTUAIS. A origem padrão é PESSOA.
            Só é aceito quando campo (o numerador, nas regras percentuais) é
            uma contagem de pessoas: integrantes, pessoas, total_pessoas,
            novos_afastados, novos, afastados ou convidados. Reduz essa
            contagem antes de agregá-la; campo_base não recebe esse filtro.
        condicao_agregada:
          allOf:
            - $ref: '#/components/schemas/CondicaoAgregada'
          description: >-
            Obrigatória para META_COMPOSTA. Cada folha compara a métrica
            numérica do campo, agregada a partir dos relatórios aprovados, com
            valor. O bônus pontos é concedido uma única vez quando a condição
            composta é atendida no escopo da regra. Para escopo NACAO, a
            distribuição padrão é para TRIBOS.
      additionalProperties: true
    FaixaPontuacao:
      type: object
      required: [minimo, pontos]
      properties:
        minimo:
          type: integer
          minimum: 0
        pontos:
          type: integer
          minimum: 0
      additionalProperties: true
    FaixaPercentual:
      type: object
      required: [minimo_percentual, pontos]
      properties:
        minimo_percentual:
          type: number
          minimum: 0
          maximum: 100
          description: Limite percentual inclusivo da faixa; valores devem ser únicos na regra.
        pontos:
          type: integer
          minimum: 0
          maximum: 1000000
      additionalProperties: true
    CondicaoPontuacao:
      type: object
      description: >-
        Condição recursiva: use `todas` (AND) ou `alguma` (OR), com até 30
        itens, ou um teste folha que exige campo e valor. origem aceita
        RELATORIO (padrão) ou PESSOA; operador aceita IGUAL/EQ, DIFERENTE/NE,
        MAIOR_QUE/GT, MAIOR_OU_IGUAL/GTE, MENOR_QUE/LT,
        MENOR_OU_IGUAL/LTE e CONTEM. Quando a condição aparece em
        quando_pessoa, a origem padrão efetiva é PESSOA.
      anyOf:
        - type: object
          required: [todas]
        - type: object
          required: [alguma]
        - type: object
          required: [campo, valor]
      properties:
        todas:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/CondicaoPontuacao'
        alguma:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/CondicaoPontuacao'
        campo:
          type: string
        origem:
          type: string
          enum: [RELATORIO, PESSOA]
          default: RELATORIO
        operador:
          type: string
          default: IGUAL
        valor:
          oneOf:
            - type: string
            - type: number
            - type: boolean
      additionalProperties: true
    CondicaoAgregada:
      type: object
      description: >-
        Árvore recursiva usada somente em META_COMPOSTA. Cada nó é um grupo
        todas (AND) ou alguma (OR), nunca ambos, com de 1 a 30 condições, ou
        uma folha com campo, operador e valor. A profundidade máxima aceita é
        8 (raiz no nível 0). As folhas comparam a soma da métrica no escopo da
        regra; campo segue as métricas aceitas para campo em RegraPontuacao,
        incluindo contagens suportadas e campos número do relatório. Operadores aceitos são IGUAL/EQ,
        DIFERENTE/NE, MAIOR_QUE/GT, MAIOR_OU_IGUAL/GTE, MENOR_QUE/LT e
        MENOR_OU_IGUAL/LTE. valor deve ser numérico entre 0 e 1.000.000; o
        operador padrão é MAIOR_OU_IGUAL. quando_pessoa é opcional e filtra
        pessoas antes da soma, somente para contagens de pessoas. O backend
        também aceita valor como string numérica conversível para decimal.
      oneOf:
        - type: object
          required: [todas]
          properties:
            todas:
              type: array
              minItems: 1
              maxItems: 30
              items:
                $ref: '#/components/schemas/CondicaoAgregada'
          additionalProperties: true
        - type: object
          required: [alguma]
          properties:
            alguma:
              type: array
              minItems: 1
              maxItems: 30
              items:
                $ref: '#/components/schemas/CondicaoAgregada'
          additionalProperties: true
        - type: object
          required: [campo, valor]
          properties:
            campo:
              type: string
              minLength: 1
            operador:
              type: string
              enum: [IGUAL, EQ, DIFERENTE, NE, MAIOR_QUE, GT, MAIOR_OU_IGUAL, GTE, MENOR_QUE, LT, MENOR_OU_IGUAL, LTE]
              default: MAIOR_OU_IGUAL
            valor:
              description: Número entre 0 e 1.000.000; strings numéricas também são convertidas pelo backend.
              anyOf:
                - type: number
                  minimum: 0
                  maximum: 1000000
                - type: string
            quando_pessoa:
              allOf:
                - $ref: '#/components/schemas/CondicaoPontuacao'
              description: >-
                Condição avaliada para cada pessoa antes da soma. Só é válida
                quando campo é uma das contagens integrantes, pessoas,
                total_pessoas, novos_afastados, novos, afastados ou convidados;
                a origem, se indicada nas folhas, precisa ser PESSOA.
          additionalProperties: true
    RequisicaoCriarMissoes:
      type: object
      required: [missoes]
      properties:
        rally:
          type: object
          allOf:
            - $ref: '#/components/schemas/DadosRally'
          nullable: true
          description: >-
            Não pode ser enviado junto com rally_id. Se rally e rally_id forem
            omitidos ou nulos, os limites do rally são inferidos a partir das
            datas das missões e o nome também é gerado.
        rally_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Identificador de rally já cadastrado ao qual as missões serão
            vinculadas. Não pode ser enviado junto com rally; um identificador
            sem rally correspondente resulta em 404.
        missoes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DadosMissao'
    RespostaInterpretacaoMissoes:
      type: object
      required: [origem, mensagem, texto_original, missoes, links_google_forms, ambiguidades, rally]
      description: >-
        Retornada apenas quando a IA consegue interpretar a mensagem. Cada
        sugestão é um objeto de dados de missão; revise as sugestões e
        ambiguidades antes de enviá-las para criação.
      properties:
        origem:
          type: string
          enum: [OPENROUTER]
        mensagem:
          type: string
        texto_original:
          type: string
        missoes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/MissaoSugerida'
        links_google_forms:
          type: array
          description: Links Google Forms HTTPS reconhecidos na mensagem original.
          items:
            type: string
            maxLength: 2048
        ambiguidades:
          type: array
          items:
            type: string
        rally:
          type: object
          allOf:
            - $ref: '#/components/schemas/DadosRally'
          nullable: true
    RespostaInterpretacaoAssincrona:
      type: object
      required: [id, estado, resultado, mensagem_erro]
      description: >-
        Estado de uma tarefa assíncrona. resultado é preenchido somente para
        CONCLUIDA; mensagem_erro é preenchida somente para FALHOU. Os demais
        estados retornam ambos como null.
      properties:
        id:
          type: string
          format: uuid
        estado:
          type: string
          enum: [NA_FILA, PROCESSANDO, CONCLUIDA, FALHOU, CANCELADA]
          description: >-
            NA_FILA indica aguardando execução; PROCESSANDO indica execução em
            andamento; CONCLUIDA indica resultado disponível; FALHOU indica
            erro de interpretação; CANCELADA indica que o cancelamento foi
            solicitado.
        resultado:
          allOf:
            - $ref: '#/components/schemas/RespostaInterpretacaoMissoes'
          nullable: true
        mensagem_erro:
          type: string
          nullable: true
    MissaoSugerida:
      type: object
      description: >-
        Objeto estruturado retornado pela IA. Toda pontuação da sugestão é
        expressa exclusivamente em regras_pontuacao. Limites de tamanho e
        validações de entrada são aplicados quando a sugestão é enviada para
        criação.
      required:
        - nome
        - descricao
        - data_inicio
        - data_fim
        - prazo_envio
        - exige_foto
        - link_google_forms
        - regras_pontuacao
        - campos_relatorio
      properties:
        nome:
          type: string
          minLength: 1
          nullable: true
        descricao:
          type: string
          nullable: true
        data_inicio:
          type: string
          format: date
          nullable: true
        data_fim:
          type: string
          format: date
          nullable: true
        prazo_envio:
          type: string
          description: Data e hora local de São Paulo, sem offset de fuso horário.
          nullable: true
        exige_foto:
          type: boolean
        link_google_forms:
          type: string
          maxLength: 2048
          nullable: true
          description: Link HTTPS extraído da mensagem; nulo quando não associado.
        regras_pontuacao:
          type: array
          description: Único campo da sugestão que representa regras de pontuação.
          items:
            $ref: '#/components/schemas/RegraPontuacao'
        campos_relatorio:
          type: array
          items:
            $ref: '#/components/schemas/CampoRelatorioMissao'
    RespostaInterpretacao:
      type: object
      required: [origem, mensagem, texto_original, regras, ambiguidades]
      description: >-
        A origem é OPENROUTER quando a consulta configurada funciona e
        FALLBACK_LOCAL quando OpenRouter não está configurado ou falha. O
        conteúdo de cada item de regras é definido pelo interpretador; somente
        as chaves nome_missao e exige_foto são exigidas na resposta da IA.
      properties:
        origem:
          type: string
          enum: [OPENROUTER, FALLBACK_LOCAL]
        mensagem:
          type: string
        texto_original:
          type: string
        regras:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        ambiguidades:
          type: array
          items:
            type: string
    CampoFormulario:
      type: object
      required: [id, titulo, tipo]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
          description: Valor não pode ser vazio nem composto somente por espaços.
        titulo:
          type: string
          minLength: 1
          maxLength: 200
          description: Valor não pode ser vazio nem composto somente por espaços.
        tipo:
          type: string
          enum: [texto, paragrafo, numero, selecao]
          description: >-
            Respostas devem preencher o campo quando obrigatorio=true. Para
            selecao, opcoes precisa conter ao menos uma opção.
        escopo:
          type: string
          enum: [RELATORIO, PESSOA]
          default: RELATORIO
          description: >-
            RELATORIO coloca a resposta em respostas; PESSOA coloca-a no mapa
            dados de cada pessoa em relatorio.pessoas. No envio público do
            formulário, campos PESSOA marcados obrigatórios devem estar
            presentes em dados de cada item de relatorio.pessoas.
        obrigatorio:
          type: boolean
          default: false
        opcoes:
          type: array
          nullable: true
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 200
            description: Valor não pode ser vazio nem composto somente por espaços.
    DefinicaoFormulario:
      type: object
      required: [titulo, campos]
      properties:
        rally_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Rally associado ao link. Obrigatório em formulários sem missao_id;
            para missões vinculadas, o backend obtém o rally da missão. Se
            missao_id e rally_id forem enviados, precisam pertencer ao mesmo rally.
        missao_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Associação opcional a uma missão. Se informada, a missão deve
            existir e o formulário público aceitará envios somente para ela.
        titulo:
          type: string
          minLength: 1
          maxLength: 200
          description: Valor não pode ser vazio nem composto somente por espaços.
        descricao:
          type: string
          maxLength: 3000
          nullable: true
        campos:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/CampoFormulario'
    DefinicaoFormularioPersistida:
      allOf:
        - $ref: '#/components/schemas/DefinicaoFormulario'
        - type: object
          required: [missao_id, rally_id]
          properties:
            missao_id:
              type: string
              format: uuid
              nullable: true
              readOnly: true
              description: >-
                Campo somente de leitura. Contém a missão associada ou null.
            rally_id:
              type: string
              format: uuid
              nullable: true
              readOnly: true
              description: >-
                Rally associado ao link ou null em formulários antigos sem escopo.
    Formulario:
      type: object
      required: [id, token, ativo, definicao]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          pattern: '^[a-f0-9]{64}$'
        ativo:
          type: boolean
        definicao:
          $ref: '#/components/schemas/DefinicaoFormularioPersistida'
    RelatorioFormulario:
      type: object
      description: >-
        Dados do relatório para esta resposta. As quantidades devem corresponder
        às pessoas fornecidas em pessoas ou, no formato legado, às linhas não
        vazias em nomes_integrantes e nomes_novos_afastados. Linhas contendo
        somente "nenhum" não contam. Cada quantidade tem limite 200 e pessoas
        aceita no máximo 400 itens.
      required: [missao_id, tribo_id]
      properties:
        missao_id:
          type: string
          format: uuid
        tribo_id:
          type: string
          format: uuid
        quantidade_pessoas:
          type: integer
          minimum: 0
          maximum: 200
          default: 0
        quantidade_novos_afastados:
          type: integer
          minimum: 0
          maximum: 200
          default: 0
        observacoes:
          type: string
          nullable: true
        pessoas:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/PessoaRelatorio'
    EnvioFormulario:
      type: object
      required:
        - relatorio
        - nacao_id
        - preenchido_por
        - respostas
      description: >-
        Use relatorio.pessoas para enviar nome, categoria e campos por pessoa.
        Se essa lista for omitida ou vazia, informe nomes_integrantes e
        nomes_novos_afastados no formato legado; esses dois campos são exigidos
        pelo serviço apenas nesse formato. Em relatorio.pessoas, cada campo
        PESSOA obrigatório da definição precisa ser informado em dados para
        cada item.
      properties:
        relatorio:
          $ref: '#/components/schemas/RelatorioFormulario'
        nacao_id:
          type: string
          format: uuid
          description: Deve corresponder à nação da tribo informada no relatório.
        nomes_integrantes:
          type: string
          maxLength: 5000
          description: >-
            Formato legado, com um nome por linha; usado quando relatorio.pessoas
            é omitido ou vazio.
        nomes_novos_afastados:
          type: string
          maxLength: 5000
          description: >-
            Formato legado, com um nome por linha; usado quando relatorio.pessoas
            é omitido ou vazio.
        preenchido_por:
          type: string
          minLength: 1
          maxLength: 200
          description: Nome da pessoa que preencheu o formulário.
        respostas:
          type: object
          maxProperties: 30
          description: Respostas de campos com escopo RELATORIO, indexadas por id do campo.
          additionalProperties:
            type: string
            maxLength: 5000
    FormularioPublico:
      type: object
      required: [definicao, nacoes, tribos, missoes, exige_foto]
      properties:
        definicao:
          $ref: '#/components/schemas/DefinicaoFormularioPersistida'
        nacoes:
          type: array
          items:
            $ref: '#/components/schemas/RespostaNacao'
        tribos:
          type: array
          items:
            $ref: '#/components/schemas/RespostaTribo'
        missoes:
          type: array
          items:
            $ref: '#/components/schemas/RespostaMissaoPublica'
        exige_foto:
          type: boolean
          description: >-
            Para compatibilidade, indica exigência de foto da missão vinculada;
            se não houver missão fixa, retorna true. Use missoes[].exige_foto
            quando o link permite escolher a missão.
    RespostaMissaoPublica:
      type: object
      required: [id, nome, exige_foto, campos_relatorio]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        exige_foto:
          type: boolean
        campos_relatorio:
          type: array
          items:
            $ref: '#/components/schemas/CampoFormulario'
    RespostaEnvioFormulario:
      type: object
      required: [id, avisos]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do relatório criado.
        avisos:
          type: array
          description: Avisos gerados, incluindo nomes repetidos na missão quando aplicável.
          items:
            $ref: '#/components/schemas/AvisoRelatorio'
    RespostaFormulario:
      type: object
      required: [respostas, definicao, tem_foto]
      properties:
        respostas:
          type: object
          description: >-
            Respostas adicionais e valores fixos do envio. O backend
            armazena nomes_integrantes, nomes_novos_afastados e preenchido_por
            também neste mapa; esses campos podem não existir em registros
            legados.
          properties:
            nomes_integrantes:
              type: string
            nomes_novos_afastados:
              type: string
            preenchido_por:
              type: string
            pessoas:
              type: array
              items:
                $ref: '#/components/schemas/PessoaRelatorio'
          additionalProperties:
            type: string
        definicao:
          $ref: '#/components/schemas/DefinicaoFormularioPersistida'
        tem_foto:
          type: boolean
