openapi: 3.0.3
info:
  title: API Rally das Tribos
  version: 1.0.0
  description: >-
    API REST do Rally das Tribos. O backend usa JSON em snake_case. Fora do modo
    de demonstração, rotas privadas aceitam a sessão Spring Security iniciada
    por login local ou OAuth2 Login do Google e também JWT no cabeçalho HTTP
    Authorization: Bearer. O JWT é emitido na resposta da sessão e expira em
    15 minutos; contém role e, para coordenadores, tribe_id ou nation_id como
    escopo. O fluxo Google redireciona o navegador de volta à aplicação; depois
    o cliente consulta GET /api/v1/autenticacao/sessao para receber o JWT no
    corpo, sem token na URL. Login Google exige e-mail verificado e conta
    autorizada ou provisionada. No modo de demonstração, a cadeia Spring
    Security permite as requisições e a consulta de sessão informa uma sessão
    de demonstração. A role e o escopo são obtidos da identidade autenticada,
    não de cabeçalhos definidos pelo cliente. O modo de demonstração é o padrão
    da configuração geral
    (RALLY_MODO_DEMONSTRACAO=true); o perfil de produção o desativa.
servers:
  - url: http://localhost:8080
    description: Execução local padrão
tags:
  - name: Autenticação
  - name: Saúde
  - name: Dados do Rally
  - name: Relatórios
  - name: Regras
  - name: Formulários
  - name: Formulários públicos
  - name: Usuários

security:
  - bearerJwt: []
  - sessaoAplicacao: []
  - {}

paths:
  /api/v1/autenticacao/csrf:
    get:
      tags: [Autenticação]
      summary: Inicializa o token CSRF do navegador
      description: >-
        Retorna 204 sem corpo e materializa o token CSRF no cookie XSRF-TOKEN
        quando necessário. Para requisições de escrita protegidas por CSRF, o
        cliente deve enviar o valor do cookie no cabeçalho X-XSRF-TOKEN. O cookie
        é legível por JavaScript; SameSite é Lax e Secure depende da configuração
        do cookie de sessão (ativado no perfil de produção).
      security: []
      responses:
        '204':
          description: Token CSRF inicializado; não há corpo de resposta

  /api/v1/autenticacao/sessao:
    get:
      tags: [Autenticação]
      summary: Consulta a sessão atual
      description: >-
        É público e retorna 200 tanto para uma sessão anônima quanto para uma
        sessão autenticada. No modo de demonstração, autenticado será true,
        provedor será DEMONSTRACAO e email_verificado será true mesmo sem uma
        identidade de usuário autenticada pelo Spring Security. Em produção,
        a resposta identifica sessões locais como LOCAL e sessões Google como
        GOOGLE. Em produção, inicie OAuth2 Login do Google em GET
        /oauth2/authorization/google. Após o callback, o backend redireciona o
        navegador para / no fluxo de entrada normal; o cliente consulta esta
        rota com a sessão do navegador e recebe role, os IDs de escopo
        (tribe_id ou nation_id) e access_token no corpo JSON. O token não é
        enviado na URL.
      responses:
        '200':
          description: Estado atual da sessão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaSessao'

  /api/v1/autenticacao/login:
    post:
      tags: [Autenticação]
      summary: Inicia uma sessão local com e-mail e senha
      description: >-
        Aceita contas locais existentes associadas a um usuário Rally com role
        atribuída. E-mails são aparados e normalizados para minúsculas para a
        consulta. A senha tem limite de 128
        caracteres e de 72 bytes em UTF-8. A primeira e a segunda falha retornam
        401 e informam que a conta será bloqueada após três tentativas. A terceira
        senha incorreta bloqueia a conta e já retorna 423; novas tentativas
        também retornam 423. Falhas para conta inexistente ou sem usuário Rally
        retornam 401, mas não incrementam o contador de bloqueio. Um login local
        correto zera o contador. No modo de demonstração a rota ainda tenta
        autenticar a conta local, mas a resposta de sessão é apresentada como
        DEMONSTRACAO e a cadeia de segurança permite as demais requisições.
        Fora desse modo, uma autenticação bem-sucedida também retorna no corpo
        role, os IDs de escopo aplicáveis e access_token. O JWT tem validade de
        15 minutos e deve ser enviado em requisições privadas no cabeçalho HTTP
        Authorization com o esquema Bearer.
      security: []
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoLogin'
      responses:
        '200':
          description: Login local concluído; retorna a sessão e o JWT no corpo JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaSessao'
        '400':
          description: >-
            Corpo inválido ou senha com mais de 72 bytes em UTF-8. Erros de
            validação automática seguem o formato do Spring.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: E-mail ou senha incorretos; a resposta informa o bloqueio após três falhas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                mensagem: E-mail ou senha incorretos. Após três tentativas, a conta será bloqueada.
        '423':
          description: Conta bloqueada após três tentativas incorretas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                mensagem: Conta bloqueada após três tentativas incorretas. Entre com Google para redefinir a senha e recuperar o acesso.
        '403':
          description: Token CSRF ausente ou inválido

  /api/v1/autenticacao/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão atual
      description: >-
        Executa o logout do Spring Security e retorna sem corpo. Em produção,
        aceita a sessão do navegador ou o JWT no cabeçalho Authorization: Bearer;
        no modo de demonstração as requisições são permitidas mesmo sem uma
        sessão autenticada. O endpoint encerra a sessão Spring Security, mas não
        revoga um JWT já emitido; esse token permanece válido até expirar
        (15 minutos após a emissão).
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      responses:
        '204':
          description: Logout concluído; não há corpo de resposta
        '401':
          description: Autenticação necessária fora do modo de demonstração
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                mensagem: Autenticação necessária.
        '403':
          description: Token CSRF ausente ou inválido

  /api/v1/autenticacao/senha/google:
    get:
      tags: [Autenticação]
      summary: Inicia o fluxo Google para criar ou recuperar senha local
      description: >-
        Em produção, marca a sessão para que, após a autenticação OAuth2 do
        Google, o navegador seja redirecionado a /definir-senha. A senha é então
        enviada a PUT /api/v1/autenticacao/senha. Esse fluxo cria ou substitui a
        senha local, zera as falhas e remove um bloqueio. No modo de demonstração
        esta rota redireciona diretamente para / e não inicia OAuth.
      security: []
      responses:
        '302':
          description: Redirecionamento para iniciar o fluxo ou retornar à página inicial
          headers:
            Location:
              schema:
                type: string
              description: >-
                Em produção, /oauth2/authorization/google; no modo de
                demonstração, /.

  /api/v1/autenticacao/senha:
    put:
      tags: [Autenticação]
      summary: Cria, redefine ou desbloqueia a senha local
      description: >-
        Requer autenticação OAuth2 do Google, e-mail verificado e autorização
        do e-mail na lista de assistentes configurada (RALLY_ASSISTENTES). Uma
        sessão local não é suficiente. A senha deve ter de 12 a 128 caracteres
        e no máximo 72 bytes em UTF-8. A operação cria ou atualiza a conta local,
        zera o contador de falhas e remove o bloqueio existente. Não há rota
        separada de recuperação: o fluxo GET /api/v1/autenticacao/senha/google
        conduz a esta operação. No modo de demonstração a cadeia de segurança
        permite a requisição, mas o controller ainda exige uma identidade OAuth2
        Google verificada e autorizada. Cabeçalhos de autenticação de API usam
        o nome HTTP em inglês Authorization, com Bearer para JWT.
      security:
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoDefinirSenha'
      responses:
        '204':
          description: Senha definida; não há corpo de resposta
        '400':
          description: Corpo inválido ou senha com mais de 72 bytes em UTF-8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Autenticação necessária fora do modo de demonstração
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                mensagem: Autenticação necessária.
        '403':
          description: >-
            Sessão não autenticada pelo Google, e-mail não verificado ou conta
            fora da lista de assistentes; também pode indicar falha de CSRF

  /api/v1/saude:
    get:
      tags: [Saúde]
      summary: Verifica se o serviço está ativo
      security: []
      responses:
        '200':
          description: Serviço disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaSaude'

  /api/v1/nacoes:
    get:
      tags: [Dados do Rally]
      summary: Lista as nações
      responses:
        '200':
          description: Nações cadastradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaNacao'

  /api/v1/tribos:
    get:
      tags: [Dados do Rally]
      summary: Lista as tribos
      responses:
        '200':
          description: Tribos cadastradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaTribo'

  /api/v1/missoes:
    get:
      tags: [Dados do Rally]
      summary: Lista as missões
      responses:
        '200':
          description: Missões cadastradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaMissao'

  /api/v1/relatorios:
    get:
      tags: [Relatórios]
      summary: Lista relatórios visíveis para a role da identidade autenticada
      description: >-
        A role e seu escopo são obtidos da identidade autenticada, incluindo do
        JWT apresentado em Authorization: Bearer. ASSISTENTE e
        ADMINISTRADOR_SISTEMA veem todos os relatórios;
        COORDENADOR_TRIBO vê relatórios da própria tribo e
        COORDENADOR_NACAO vê relatórios das tribos da própria nação. Em modo de
        demonstração, uma requisição sem identidade autenticada usa o contexto
        ASSISTENTE.
      responses:
        '200':
          description: Relatórios visíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaRelatorio'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
    post:
      tags: [Relatórios]
      summary: Envia um relatório
      description: >-
        Exige role COORDENADOR_TRIBO ou COORDENADOR_NACAO no contexto autenticado
        e permite criar relatório somente para tribo dentro do escopo de
        tribe_id ou nation_id da identidade. O escopo é lido do JWT enviado em
        Authorization: Bearer ou da identidade Spring Security. No modo de
        demonstração, uma requisição sem identidade autenticada usa o
        COORDENADOR_TRIBO da tribo informada no corpo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoRelatorio'
      responses:
        '200':
          description: Relatório criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaRelatorio'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/relatorios/{id}/aprovar:
    post:
      tags: [Relatórios]
      summary: Aprova um relatório
      description: Exige role ASSISTENTE ou ADMINISTRADOR_SISTEMA na identidade autenticada.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoRevisao'
      responses:
        '200':
          description: Relatório aprovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaRelatorio'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/relatorios/{id}/rejeitar:
    post:
      tags: [Relatórios]
      summary: Rejeita um relatório
      description: Exige role ASSISTENTE ou ADMINISTRADOR_SISTEMA na identidade autenticada.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoRevisao'
      responses:
        '200':
          description: Relatório rejeitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaRelatorio'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/relatorios/{id}/arquivos:
    post:
      tags: [Relatórios]
      summary: Envia um arquivo para o Google Drive e o associa ao relatório
      description: >-
        O arquivo não pode estar vazio. A operação exige acesso de ASSISTENTE
        ou ADMINISTRADOR_SISTEMA, ou uma role de coordenador cujo escopo inclua
        a tribo ou nação do relatório, além de uma sessão Google com autorização
        para o Drive. Para autenticação por JWT, use Authorization: Bearer; o
        token de usuário Google contém a referência necessária para localizar a
        autorização OAuth do Drive. O limite de arquivo configurado pelo servidor
        Spring é 15 MB.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
                  description: Arquivo não vazio a enviar ao Google Drive.
      responses:
        '200':
          description: Identificador do arquivo no Google Drive
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '502':
          description: O Google Drive não confirmou o envio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '503':
          description: A sessão ou a integração com o Google Drive não está disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/v1/placar:
    get:
      tags: [Dados do Rally]
      summary: Gera o placar das tribos
      responses:
        '200':
          description: Tribos classificadas por pontuação
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaPlacar'

  /api/v1/regras/interpretar:
    post:
      tags: [Regras]
      summary: Interpreta um texto de regras
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoInterpretacao'
      responses:
        '200':
          description: Interpretação produzida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaInterpretacao'
        '400':
          $ref: '#/components/responses/ErroRequisicao'

  /api/v1/usuarios/{email}/role:
    put:
      tags: [Usuários]
      summary: Define a role e o escopo de um usuário
      description: >-
        Requer a role ADMINISTRADOR_SISTEMA na identidade autenticada. Envie o
        JWT no cabeçalho HTTP Authorization com o esquema Bearer. Para
        COORDENADOR_TRIBO, tribe_id é obrigatório e nation_id deve ser omitido;
        para COORDENADOR_NACAO, nation_id é obrigatório e tribe_id deve ser
        omitido. ASSISTENTE e ADMINISTRADOR_SISTEMA não aceitam IDs de escopo.
        Os IDs de tribo ou nação precisam existir. O administrador inicial
        definido pela configuração não pode perder ADMINISTRADOR_SISTEMA.
      security:
        - bearerJwt: []
        - sessaoAplicacao: []
      parameters:
        - $ref: '#/components/parameters/EmailUsuario'
        - $ref: '#/components/parameters/CabecalhoCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisicaoPapel'
            examples:
              coordenadorTribo:
                summary: Coordenador vinculado a uma tribo
                value:
                  role: COORDENADOR_TRIBO
                  tribe_id: 11111111-1111-1111-1111-111111111111
                  nation_id: null
              coordenadorNacao:
                summary: Coordenador vinculado a uma nação
                value:
                  role: COORDENADOR_NACAO
                  tribe_id: null
                  nation_id: 22222222-2222-2222-2222-222222222222
      responses:
        '200':
          description: Role e escopo atribuídos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaUsuario'
        '400':
          description: Role inválida, escopo incompatível ou ID de tribo/nação inexistente
        '401':
          description: Autenticação necessária fora do modo de demonstração
        '403':
          description: >-
            Identidade sem role ADMINISTRADOR_SISTEMA ou token CSRF ausente ou
            inválido
        '409':
          description: O administrador inicial configurado não pode perder sua role

  /api/v1/formularios:
    get:
      tags: [Formulários]
      summary: Lista formulários públicos cadastrados
      description: >-
        Exige role ASSISTENTE ou ADMINISTRADOR_SISTEMA na identidade
        autenticada. Em produção, uma sessão Google precisa ter e-mail
        verificado e estar autorizada; também é aceito JWT em Authorization:
        Bearer. Em modo de demonstração, a verificação de role usa o contexto
        ASSISTENTE quando não há identidade autenticada.
      responses:
        '200':
          description: Formulários cadastrados, inclusive token de acesso público
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Formulario'
        '403':
          $ref: '#/components/responses/AcessoNegado'
    post:
      tags: [Formulários]
      summary: Cria um formulário público para receber relatórios do período
      description: >-
        Um formulário é um link de coleta, normalmente mensal, e não fica
        associado a uma missão. ASSISTENTE ou ADMINISTRADOR_SISTEMA pode criar
        a definição com uma lista vazia de campos adicionais. Cada envio escolhe a própria missão.
        Novos requests omitem missao_id. Nas respostas de formulários novos,
        o record inclui missao_id nulo; definições antigas ainda podem trazer
        um UUID. O controller também tolera missao_id em um request de criação
        legado, mas descarta o valor ao persistir um formulário novo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinicaoFormulario'
            example:
              titulo: Relatório mensal
              descricao: Relatórios das missões realizadas neste mês.
              campos: []
      responses:
        '200':
          description: Formulário criado com token público gerado pelo servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Formulario'
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/formularios/{id}/desativar:
    post:
      tags: [Formulários]
      summary: Desativa um formulário público
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA na identidade
        autenticada. Em modo de demonstração, uma requisição sem identidade
        autenticada usa o contexto ASSISTENTE.
      parameters:
        - $ref: '#/components/parameters/FormularioId'
      responses:
        '200':
          description: Formulário desativado; resposta sem corpo
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/publico/formularios/{token}:
    get:
      tags: [Formulários públicos]
      summary: Consulta a definição de um formulário público ativo
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenFormulario'
      responses:
        '200':
          description: >-
            Definição do formulário, nações, tribos e missões disponíveis. O
            requisito de foto é sempre exige_foto=true para este fluxo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormularioPublico'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/publico/formularios/{token}/respostas:
    post:
      tags: [Formulários públicos]
      summary: Envia respostas de um formulário público
      description: >-
        A parte dados é JSON e deve incluir
        relatorio, nacao_id, nomes_integrantes, nomes_novos_afastados,
        preenchido_por e respostas adicionais. relatorio.missao_id é escolhido
        neste envio, sem vínculo com a definição do formulário. As quantidades
        em relatorio são contadas pelas linhas não vazias dos campos de nomes;
        uma linha contendo apenas "nenhum" (sem diferenciar maiúsculas) também
        não conta. Definições legadas que ainda tenham missao_id continuam
        restringindo os envios àquela missão.
        nomes_integrantes, nomes_novos_afastados e preenchido_por são
        obrigatórios. A parte arquivo é obrigatória e aceita uma única imagem
        JPEG, PNG ou WebP de até 5 MB. Os valores fixos de nomes e responsável
        são gravados também em respostas sob as chaves
        nomes_integrantes, nomes_novos_afastados e preenchido_por.
        nacao_id deve corresponder à nação da tribo informada; missao_id deve
        identificar uma missão existente. O conteúdo da foto também precisa
        corresponder ao MIME type declarado.
      security: []
      parameters:
        - $ref: '#/components/parameters/TokenFormulario'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [dados, arquivo]
              properties:
                dados:
                  $ref: '#/components/schemas/EnvioFormulario'
                arquivo:
                  type: string
                  format: binary
                  description: >-
                    Uma única imagem obrigatória JPEG, PNG ou WebP, com até
                    5 MB. O conteúdo deve corresponder ao tipo informado.
            encoding:
              dados:
                contentType: application/json
      responses:
        '200':
          description: Resposta registrada e identificador do relatório criado
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/ErroRequisicao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /api/v1/formularios/respostas/{id}:
    get:
      tags: [Formulários]
      summary: Consulta respostas do formulário recebidas pela assistente
      description: >-
        Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA na identidade
        autenticada. O mapa respostas contém os valores fixos
        nomes_integrantes, nomes_novos_afastados e preenchido_por, além das
        respostas adicionais. Registros antigos podem continuar trazendo
        missao_id na definição.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
      responses:
        '200':
          description: Respostas associadas ao relatório
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RespostaFormulario'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /api/v1/formularios/respostas/{id}/foto:
    get:
      tags: [Formulários]
      summary: Obtém a foto enviada com as respostas
      description: Requer role ASSISTENTE ou ADMINISTRADOR_SISTEMA na identidade autenticada.
      parameters:
        - $ref: '#/components/parameters/RelatorioId'
      responses:
        '200':
          description: Bytes da imagem armazenada
          headers:
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Envie o access_token no cabeçalho HTTP Authorization: Bearer. O servidor
        valida o JWT HS256, o emissor, a audiência e a validade temporal. Tokens
        emitidos pelo backend expiram 15 minutos após a emissão.
    sessaoAplicacao:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >-
        Cookie de sessão do Spring Security após login local ou OAuth2 Login do
        Google. Aplicável quando RALLY_MODO_DEMONSTRACAO=false; no modo de
        demonstração a cadeia Spring Security permite as requisições.
  parameters:
    CabecalhoCsrf:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: >-
        Token obtido do cookie XSRF-TOKEN após consultar GET
        /api/v1/autenticacao/csrf. Envie este cabeçalho nas requisições de
        escrita; o cookie também deve acompanhar a sessão do navegador.
      schema:
        type: string
    EmailUsuario:
      name: email
      in: path
      required: true
      description: E-mail do usuário cuja role e escopo serão definidos.
      schema:
        type: string
    RelatorioId:
      name: id
      in: path
      required: true
      description: Identificador UUID do relatório.
      schema:
        type: string
        format: uuid
    FormularioId:
      name: id
      in: path
      required: true
      description: Identificador UUID do formulário.
      schema:
        type: string
        format: uuid
    TokenFormulario:
      name: token
      in: path
      required: true
      description: Token hexadecimal de 64 caracteres do formulário público.
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
  responses:
    ErroRequisicao:
      description: Requisição inválida ou dados rejeitados pela validação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    AcessoNegado:
      description: Acesso negado para o papel ou sessão atual
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Recurso inexistente ou formulário público inválido ou desativado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    RequisicaoLogin:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 255
        senha:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Senha da conta local. Além do limite de 128 caracteres, o endpoint
            rejeita valores com mais de 72 bytes em UTF-8.
    RequisicaoDefinirSenha:
      type: object
      required: [senha]
      properties:
        senha:
          type: string
          minLength: 12
          maxLength: 128
          description: >-
            Nova senha local. Além do intervalo de 12 a 128 caracteres, o
            endpoint rejeita valores com mais de 72 bytes em UTF-8.
    PapelUsuario:
      type: string
      enum: [ASSISTENTE, COORDENADOR_TRIBO, COORDENADOR_NACAO, ADMINISTRADOR_SISTEMA]
    RespostaSessao:
      type: object
      description: >-
        Role é o papel do usuário. Para COORDENADOR_TRIBO, tribe_id informa o
        escopo; para COORDENADOR_NACAO, nation_id informa o escopo. Os dois IDs
        são null para ASSISTENTE e ADMINISTRADOR_SISTEMA. Não há uma propriedade
        JSON separada chamada scope.
      required: [autenticado, email, nome, provedor, email_verificado, role, tribe_id, nation_id, access_token]
      properties:
        autenticado:
          type: boolean
        email:
          type: string
          nullable: true
          description: Pode conter um valor descritivo em modo de demonstração.
        nome:
          type: string
          nullable: true
        provedor:
          type: string
          enum: [DEMONSTRACAO, GOOGLE, LOCAL]
          nullable: true
        email_verificado:
          type: boolean
        role:
          type: string
          enum: [ASSISTENTE, COORDENADOR_TRIBO, COORDENADOR_NACAO, ADMINISTRADOR_SISTEMA]
          nullable: true
          description: >-
            Nulo para uma sessão anônima fora do modo de demonstração; no modo
            de demonstração o valor é ASSISTENTE.
        tribe_id:
          type: string
          format: uuid
          nullable: true
          description: Escopo da role COORDENADOR_TRIBO; nulo para as demais roles.
        nation_id:
          type: string
          format: uuid
          nullable: true
          description: Escopo da role COORDENADOR_NACAO; nulo para as demais roles.
        access_token:
          type: string
          nullable: true
          description: >-
            JWT de acesso, válido por 15 minutos. Nulo para sessão anônima e no
            modo de demonstração.
    RequisicaoPapel:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/PapelUsuario'
        tribe_id:
          type: string
          format: uuid
          nullable: true
          description: Obrigatório para COORDENADOR_TRIBO; deve ser omitido ou nulo para outras roles.
        nation_id:
          type: string
          format: uuid
          nullable: true
          description: Obrigatório para COORDENADOR_NACAO; deve ser omitido ou nulo para outras roles.
    RespostaUsuario:
      type: object
      required: [id, email, role, tribe_id, nation_id]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/PapelUsuario'
        tribe_id:
          type: string
          format: uuid
          nullable: true
        nation_id:
          type: string
          format: uuid
          nullable: true
    Erro:
      type: object
      description: >-
        Erros tratados explicitamente pela API usam a propriedade mensagem.
        Respostas de validação automática do Spring podem incluir outras
        propriedades, pois seguem o formato padrão do framework.
      additionalProperties: true
      properties:
        mensagem:
          type: string
          description: Mensagem da falha retornada pelo handler de exceções da API.
    RespostaSaude:
      type: object
      properties:
        status:
          type: string
          example: ok
        servico:
          type: string
          example: servico-rally
        idioma:
          type: string
          example: pt-BR
    RespostaNacao:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
    RespostaTribo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        nacao_id:
          type: string
          format: uuid
        nacao_nome:
          type: string
    RespostaMissao:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        descricao:
          type: string
          nullable: true
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date
        prazo_envio:
          type: string
          description: Data e hora local de São Paulo, sem offset de fuso horário; pode ser nulo.
          nullable: true
        pontos_por_pessoa:
          type: integer
        pontos_por_novo_afastado:
          type: integer
        bonificacao_a_cada_cinco_novos:
          type: integer
        meta_nacional:
          type: integer
        bonificacao_meta_nacional:
          type: integer
        exige_foto:
          type: boolean
        tipo_pessoa:
          type: string
        status:
          type: string
        versao:
          type: integer
    RequisicaoRelatorio:
      type: object
      required: [missao_id, tribo_id]
      properties:
        missao_id:
          type: string
          format: uuid
        tribo_id:
          type: string
          format: uuid
        quantidade_pessoas:
          type: integer
          minimum: 0
          default: 0
        quantidade_novos_afastados:
          type: integer
          minimum: 0
          default: 0
        observacoes:
          type: string
          nullable: true
    RespostaRelatorio:
      type: object
      properties:
        id:
          type: string
          format: uuid
        missao_id:
          type: string
          format: uuid
        missao_nome:
          type: string
        tribo_id:
          type: string
          format: uuid
        tribo_nome:
          type: string
        nacao_nome:
          type: string
        quantidade_pessoas:
          type: integer
        quantidade_novos_afastados:
          type: integer
        observacoes:
          type: string
          nullable: true
        enviado_em:
          type: string
          description: Data e hora local de São Paulo, sem offset de fuso horário.
        atrasado:
          type: boolean
        status:
          type: string
        pontos_aprovados:
          type: integer
        justificativa_revisao:
          type: string
          nullable: true
    RequisicaoRevisao:
      type: object
      properties:
        justificativa:
          type: string
          nullable: true
    RespostaPlacar:
      type: object
      properties:
        posicao:
          type: integer
        tribo_id:
          type: string
          format: uuid
        tribo_nome:
          type: string
        nacao_nome:
          type: string
        pontos:
          type: integer
          format: int64
        pessoas_aprovadas:
          type: integer
          format: int64
        relatorios_aprovados:
          type: integer
          format: int64
        bonus_nacional:
          type: integer
          format: int64
    RequisicaoInterpretacao:
      type: object
      required: [texto]
      properties:
        texto:
          type: string
          minLength: 1
    RespostaInterpretacao:
      type: object
      properties:
        origem:
          type: string
        mensagem:
          type: string
        texto_original:
          type: string
        regras:
          type: array
          items:
            type: object
            additionalProperties: true
        ambiguidades:
          type: array
          items:
            type: string
    CampoFormulario:
      type: object
      required: [id, titulo, tipo]
      properties:
        id:
          type: string
          maxLength: 80
        titulo:
          type: string
          maxLength: 200
        tipo:
          type: string
          enum: [texto, paragrafo, numero, selecao]
        obrigatorio:
          type: boolean
          default: false
        opcoes:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 200
    DefinicaoFormulario:
      type: object
      required: [titulo, campos]
      properties:
        titulo:
          type: string
          maxLength: 200
        descricao:
          type: string
          maxLength: 3000
          nullable: true
        campos:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/CampoFormulario'
    DefinicaoFormularioPersistida:
      allOf:
        - $ref: '#/components/schemas/DefinicaoFormulario'
        - type: object
          required: [missao_id]
          properties:
            missao_id:
              type: string
              format: uuid
              nullable: true
              deprecated: true
              readOnly: true
              description: >-
                Campo somente de leitura. Pode conter a missão antiga ou ser
                nulo em formulários criados sem associação a missão.
    Formulario:
      type: object
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          pattern: '^[a-f0-9]{64}$'
        ativo:
          type: boolean
        definicao:
          $ref: '#/components/schemas/DefinicaoFormularioPersistida'
    RelatorioFormulario:
      type: object
      description: >-
        Dados do relatório para esta resposta. As quantidades são derivadas
        da quantidade de linhas não vazias em nomes_integrantes e
        nomes_novos_afastados, respectivamente. Cada lista aceita no máximo
        200 nomes.
      required: [missao_id, tribo_id, quantidade_pessoas, quantidade_novos_afastados]
      properties:
        missao_id:
          type: string
          format: uuid
        tribo_id:
          type: string
          format: uuid
        quantidade_pessoas:
          type: integer
          minimum: 0
        quantidade_novos_afastados:
          type: integer
          minimum: 0
        observacoes:
          type: string
          nullable: true
    EnvioFormulario:
      type: object
      required:
        - relatorio
        - nacao_id
        - nomes_integrantes
        - nomes_novos_afastados
        - preenchido_por
        - respostas
      properties:
        relatorio:
          $ref: '#/components/schemas/RelatorioFormulario'
        nacao_id:
          type: string
          format: uuid
          description: Deve corresponder à nação da tribo informada no relatório.
        nomes_integrantes:
          type: string
          minLength: 1
          maxLength: 5000
          description: Lista de integrantes, com um nome por linha.
        nomes_novos_afastados:
          type: string
          minLength: 1
          maxLength: 5000
          description: Lista de pessoas novas ou afastadas, com um nome por linha.
        preenchido_por:
          type: string
          minLength: 1
          maxLength: 200
          description: Nome da pessoa que preencheu o formulário.
        respostas:
          type: object
          maxProperties: 30
          additionalProperties:
            type: string
    FormularioPublico:
      type: object
      required: [definicao, nacoes, tribos, missoes, exige_foto]
      properties:
        definicao:
          $ref: '#/components/schemas/DefinicaoFormularioPersistida'
        nacoes:
          type: array
          items:
            $ref: '#/components/schemas/RespostaNacao'
        tribos:
          type: array
          items:
            $ref: '#/components/schemas/RespostaTribo'
        missoes:
          type: array
          items:
            $ref: '#/components/schemas/RespostaMissao'
        exige_foto:
          type: boolean
          enum: [true]
    RespostaFormulario:
      type: object
      properties:
        respostas:
          type: object
          description: >-
            Respostas adicionais e valores fixos do envio. O backend
            armazena nomes_integrantes, nomes_novos_afastados e preenchido_por
            também neste mapa; esses campos podem não existir em registros
            legados.
          properties:
            nomes_integrantes:
              type: string
            nomes_novos_afastados:
              type: string
            preenchido_por:
              type: string
          additionalProperties:
            type: string
        definicao:
          $ref: '#/components/schemas/DefinicaoFormularioPersistida'
        tem_foto:
          type: boolean
