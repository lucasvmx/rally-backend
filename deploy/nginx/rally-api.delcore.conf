# Instale como /etc/nginx/conf.d/rally-api.delcore.conf.
# Os caminhos abaixo seguem o padrão do Let's Encrypt; ajuste-os se o certificado
# e a chave privada forem instalados em outro local na VPS.

# O Nginx carrega este arquivo dentro do contexto http quando instalado em conf.d.
variables_hash_max_size 2048;

# Preflight CORS não leva o header X-Rally-Frontend-Key; deixe-o chegar ao backend.
# Os demais métodos precisam apresentar a chave enviada pelo frontend.
map "$request_method:$http_x_rally_frontend_key" $rally_frontend_key_invalid {
    default 1;
    ~^OPTIONS: 0;
    ~^[^:]+:bf4d540978cb286715997b00dae6c909976cb8971293dd48d9096bb0c9277c77$ 0;
}

# Rejeita acessos HTTP sem o domínio configurado, inclusive acesso simples pelo IP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    return 444;
}

# Rejeita a conexão TLS quando o cliente não envia o SNI do domínio configurado.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name rally-api.delcore.com.br;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rally-api.delcore.com.br;

    ssl_certificate     /etc/letsencrypt/live/rally-api.delcore.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rally-api.delcore.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        # Filtro de ruído para clientes que não carregaram o frontend oficial.
        # A chave também está no bundle do navegador e não deve ser tratada como autenticação.
        if ($rally_frontend_key_invalid) {
            return 423;
        }

        # Em Docker, publique a porta do container assim: 127.0.0.1:8082:8080.
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }
}
