spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
            redirect-uri: "${RALLY_FRONTEND_ORIGIN:https://rallydastribos.delcore.com.br}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/drive.file

rally:
  frontend:
    origem: ${RALLY_FRONTEND_ORIGIN:https://rallydastribos.delcore.com.br}
  autenticacao:
    jwt-segredo: ${RALLY_JWT_SECRET}

server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
